<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tune to Xylophone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
  <style>
    :root {
      --c1: #d63c30; /* C  red */
      --c2: #ee9421; /* D  orange */
      --c3: #e6bd1c; /* E  gold */
      --c4: #4ba54f; /* F  green */
      --c5: #12897e; /* G  teal */
      --c6: #189ad3; /* A  blue */
      --c7: #6a3fae; /* B  purple */
      --c8: #d84941; /* C' red */
    }

    /* Wood material: swaps the rainbow bar/chip palette for an oak-to-walnut gradient. */
    body[data-material="wood"] {
      --c1: hsl(32, 42%, 62%);
      --c2: hsl(31, 42%, 59%);
      --c3: hsl(30, 43%, 55%);
      --c4: hsl(28, 43%, 52%);
      --c5: hsl(27, 44%, 48%);
      --c6: hsl(25, 45%, 45%);
      --c7: hsl(24, 46%, 41%);
      --c8: hsl(22, 47%, 38%);
    }

    body[data-material="wood"] .bar {
      background-image:
        repeating-linear-gradient(180deg,
          rgba(0, 0, 0, .08) 0px, rgba(0, 0, 0, .08) 1px,
          transparent 1px, transparent 5px,
          rgba(255, 255, 255, .05) 5px, rgba(255, 255, 255, .05) 6px,
          transparent 6px, transparent 13px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .15);
    }

    .bar.active { filter: brightness(1.35); transform: scale(.97); }
    .chip.playing { outline: 2px solid #fff; transform: scale(1.12); }
    .chip.lyric-linked { border-bottom: 3px solid var(--c5); }
    .chip.lyric-selecting { outline: 2px dashed #fff; outline-offset: 1px; }
    .lyric-tagged { border-bottom: 2px solid var(--c5); }
    .lyric-tagged.playing { background: var(--c5); color: #fff; border-radius: 3px; padding: 0 2px; }
    .lyric-editable:empty::before { content: 'Click to add lyrics…'; opacity: .5; font-style: italic; }

    .caret { display: inline-block; width: 2px; height: 18px; background: #e8eaed; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      .bar.active, .chip.playing { transform: none; }
      .caret { opacity: 1; }
    }
  </style>
</head>

<body class="m-0 min-h-screen bg-[#212326] text-[#e8eaed] [font-family:-apple-system,'Segoe_UI',Roboto,sans-serif] px-4 pt-[18px]">
  <div id="root"></div>

  <script>
    const html = htm.bind(React.createElement);
    const { useState, useRef, useEffect, useReducer, useCallback } = React;

    // ---------- 8-note diatonic set, C5 to C6 (bright toy-xylophone register) ----------
    const NOTES = [
      { name: 'C', freq: 523.25, color: 'var(--c1)' },
      { name: 'D', freq: 587.33, color: 'var(--c2)' },
      { name: 'E', freq: 659.26, color: 'var(--c3)' },
      { name: 'F', freq: 698.46, color: 'var(--c4)' },
      { name: 'G', freq: 783.99, color: 'var(--c5)' },
      { name: 'A', freq: 880.00, color: 'var(--c6)' },
      { name: 'B', freq: 987.77, color: 'var(--c7)' },
      { name: 'C2', freq: 1046.5, color: 'var(--c8)', label: 'C' },
    ];

    // ---------- Sound: struck metal/wood bar (modal synthesis) ----------
    let audioCtx = null, bus = null;
    function ctx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.ratio.value = 6;
        comp.connect(audioCtx.destination);
        bus = audioCtx.createGain();
        bus.gain.value = 0.85;
        bus.connect(comp);
      }
      return audioCtx;
    }
    let noiseBuffer = null;
    function getNoiseBuffer(ac) {
      if (noiseBuffer) return noiseBuffer;
      const len = ac.sampleRate * 0.03;
      noiseBuffer = ac.createBuffer(1, len, ac.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      return noiseBuffer;
    }
    // metal: long, bright, shimmering ring (detuned mode pair beats against itself).
    // wood: marimba-style undercut-tuned partials, fast dry decay, low mallet "thock".
    const SOUND_PROFILES = {
      metal: {
        modes: [
          { ratio: 1.000, gain: 0.55, decay: 1.5 },
          { ratio: 1.004, gain: 0.28, decay: 1.3 },
          { ratio: 2.756, gain: 0.20, decay: 0.60 },
          { ratio: 5.404, gain: 0.11, decay: 0.30 },
          { ratio: 8.933, gain: 0.05, decay: 0.16 },
        ],
        noise: { freqMul: 2.5, gain: 0.22, decay: 0.012 },
        lowpass: null,
      },
      wood: {
        modes: [
          { ratio: 1.000, gain: 0.70, decay: 0.35 },
          { ratio: 3.932, gain: 0.16, decay: 0.20 },
          { ratio: 9.538, gain: 0.05, decay: 0.09 },
        ],
        noise: { freqMul: 1.1, gain: 0.40, decay: 0.02 },
        lowpass: 3400,
      },
    };
    function playNote(i, soundType, barEls, when = 0, holdMs = 180) {
      const ac = ctx();
      const t0 = ac.currentTime + when;
      const freq = NOTES[i].freq * (1 + (Math.random() - 0.5) * 0.002);
      const profile = SOUND_PROFILES[soundType];
      const out = ac.createGain();
      out.gain.value = 1;
      const dest = out;
      let chainEnd = out;
      if (profile.lowpass) {
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = profile.lowpass;
        out.connect(lp);
        chainEnd = lp;
      }
      if (ac.createStereoPanner) {
        const pan = ac.createStereoPanner();
        pan.pan.value = (i / 7 - 0.5) * 0.6;
        chainEnd.connect(pan); pan.connect(bus);
      } else {
        chainEnd.connect(bus);
      }
      profile.modes.forEach(m => {
        const osc = ac.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq * m.ratio;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(m.gain, t0 + 0.0015);
        g.gain.setTargetAtTime(0.0001, t0 + 0.0015, m.decay / 6);
        osc.connect(g); g.connect(dest);
        osc.start(t0);
        osc.stop(t0 + m.decay + 0.3);
      });
      const noise = ac.createBufferSource();
      noise.buffer = getNoiseBuffer(ac);
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = freq * profile.noise.freqMul;
      bp.Q.value = 1.0;
      const ng = ac.createGain();
      ng.gain.setValueAtTime(profile.noise.gain, t0);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + profile.noise.decay);
      noise.connect(bp); bp.connect(ng); ng.connect(dest);
      noise.start(t0);
      noise.stop(t0 + profile.noise.decay + 0.02);

      const el = barEls && barEls[i];
      if (el) {
        setTimeout(() => {
          el.classList.add('active');
          setTimeout(() => el.classList.remove('active'), holdMs);
        }, Math.max(0, when * 1000));
      }
    }
    function loadSoundPref() {
      try { return localStorage.getItem('xyloSound') === 'wood' ? 'wood' : 'metal'; }
      catch { return 'metal'; }
    }
    function saveSoundPref(v) {
      try { localStorage.setItem('xyloSound', v); } catch { /* ignore, e.g. storage disabled */ }
    }

    // ---------- The pad's data model: lines of notes, edited like text ----------
    // lines = [{notes:[{i,sec} | {rest:true,sec}], lyric:''}]
    // sec = seconds to hold before the next event starts. Captured from real
    // elapsed time when a note is played live; a fixed default otherwise.
    // cursor sits before notes[pos] on lines[line], like a text caret
    const QUARTER_SEC = 0.4;
    const REST_UNIT_SEC = QUARTER_SEC / 4;
    const MIN_LIVE_GAP_SEC = 0.06;
    const PHRASE_BREAK_SEC = 0.4;
    const MAX_PAUSE_SEC = 1.6;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const dotCount = (n) => Math.max(1, Math.round(n.sec / REST_UNIT_SEC));
    const hasNotes = (lines) => lines.some(l => l.notes.some(n => !n.rest));

    // ---------- Lyric annotations: link a note or a run of notes to a stretch of a line's words ----------
    // A link is anchored on its first note: note.lyricStart/lyricEnd are character offsets into
    // the line's own `lyric` text, note.lyricSpan is how many consecutive notes (this one
    // included) it covers. Anchoring on the note object itself (not an index) means the link
    // rides along automatically when notes before it are inserted, deleted, or reordered.
    function collectLineTags(line) {
      const tags = [];
      line.notes.forEach((n, ni) => {
        if (n.lyricStart !== undefined) tags.push({ start: n.lyricStart, end: n.lyricEnd, noteIdx: ni, noteSpan: n.lyricSpan || 1 });
      });
      tags.sort((a, b) => a.start - b.start);
      return tags;
    }
    function stripLyricTags(notesArr) {
      notesArr.forEach(n => { delete n.lyricStart; delete n.lyricEnd; delete n.lyricSpan; });
    }
    // Insertion/removal at `pos` (pre-mutation index) can only corrupt a link whose span
    // strictly contains it - before its anchor the link is unaffected (rides with the anchor
    // object), and removing the anchor itself already self-heals via collectLineTags.
    function invalidateTagsAt(line, pos) {
      collectLineTags(line).forEach(t => {
        if (pos > t.noteIdx && pos <= t.noteIdx + t.noteSpan - 1) stripLyricTags([line.notes[t.noteIdx]]);
      });
    }
    // A new link overwrites any existing link that overlaps it on either axis - the note
    // range or the text range - so a partial overwrite can't leave a stale, half-matching link.
    function clearTagOverlap(line, noteStart, noteEnd, charStart, charEnd) {
      collectLineTags(line).forEach(t => {
        const noteOverlap = t.noteIdx <= noteEnd && t.noteIdx + t.noteSpan - 1 >= noteStart;
        const charOverlap = t.start < charEnd && t.end > charStart;
        if (noteOverlap || charOverlap) stripLyricTags([line.notes[t.noteIdx]]);
      });
    }
    function linkLyricSelection(line, noteStart, noteEnd, charStart, charEnd) {
      clearTagOverlap(line, noteStart, noteEnd, charStart, charEnd);
      const anchor = line.notes[noteStart];
      anchor.lyricStart = charStart;
      anchor.lyricEnd = charEnd;
      anchor.lyricSpan = noteEnd - noteStart + 1;
    }
    // Flat character offset of (node, offset) within root's text, for turning a DOM Range
    // (which addresses a specific text node) into a plain index into line.lyric.
    function textOffset(root, node, offset) {
      let total = 0;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let cur;
      while ((cur = walker.nextNode())) {
        if (cur === node) return total + offset;
        total += cur.textContent.length;
      }
      return total;
    }

    // ---------- Built-in tunes (public domain): notes + the rhyme line below ----------
    // "5-" holds longer, "5--" longer still; "." is a short rest.
    const EXAMPLES = {
      "Twinkle Twinkle Little Star": [
        { n: "1 1 5 5 6 6 5-", t: "Twinkle, twinkle, little star" },
        { n: "4 4 3 3 2 2 1-", t: "How I wonder what you are" },
        { n: "5 5 4 4 3 3 2-", t: "Up above the world so high" },
        { n: "5 5 4 4 3 3 2-", t: "Like a diamond in the sky" },
        { n: "1 1 5 5 6 6 5-", t: "Twinkle, twinkle, little star" },
        { n: "4 4 3 3 2 2 1-", t: "How I wonder what you are" },
      ],
      "Mary Had a Little Lamb": [
        { n: "3 2 1 2 3 3 3-", t: "Mary had a little lamb" },
        { n: "2 2 2- 3 5 5-", t: "Little lamb, little lamb" },
        { n: "3 2 1 2 3 3 3 3", t: "Mary had a little lamb, its" },
        { n: "2 2 3 2 1-", t: "fleece was white as snow" },
      ],
      "Hot Cross Buns": [
        { n: "3 2 1- 3 2 1-", t: "Hot cross buns, hot cross buns" },
        { n: "1 1 1 1 2 2 2 2", t: "One a penny, two a penny" },
        { n: "3 2 1-", t: "Hot cross buns" },
      ],
      "Ode to Joy": [
        { n: "3 3 4 5 5 4 3 2", t: "" },
        { n: "1 1 2 3 3- 2 2-", t: "" },
        { n: "3 3 4 5 5 4 3 2", t: "" },
        { n: "1 1 2 3 2- 1 1-", t: "" },
      ],
    };
    function parseLine(str) {
      const notes = [];
      str.trim().split(/\s+/).forEach(tok => {
        if (tok === '.') { notes.push({ rest: true, sec: REST_UNIT_SEC }); return; }
        const m = tok.match(/^([1-8])(-*)$/);
        if (m) notes.push({ i: +m[1] - 1, sec: (1 + m[2].length) * QUARTER_SEC });
      });
      return notes;
    }

    // ---------- Saved songs: your own tunes, kept in localStorage ----------
    function loadSavedSongs() {
      try { return JSON.parse(localStorage.getItem('xyloSongs')) || {}; }
      catch { return {}; }
    }
    function persistSavedSongs(songs) {
      try { localStorage.setItem('xyloSongs', JSON.stringify(songs)); }
      catch { /* ignore, e.g. storage disabled */ }
    }
    function cloneLines(ls) {
      return ls.map(l => ({ lyric: l.lyric, notes: l.notes.map(n => ({ ...n })) }));
    }

    // ---------- Pitch detection (autocorrelation, ACF2+) ----------
    function autoCorrelate(buf, sampleRate) {
      let SIZE = buf.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) { const v = buf[i]; rms += v * v; }
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.010) return -1;
      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
      for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
      buf = buf.slice(r1, r2);
      SIZE = buf.length;
      if (SIZE < 512) return -1;
      const c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE - i; j++) { c[i] += buf[j] * buf[j + i]; }
      }
      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }
      let T0 = maxpos;
      if (T0 <= 0) return -1;
      const x1 = c[T0 - 1] || c[T0], x2 = c[T0], x3 = c[T0 + 1] || c[T0];
      const a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);
      return sampleRate / T0;
    }
    function freqToNoteIndex(freq) {
      if (freq <= 0) return -1;
      const semis = 12 * Math.log2(freq / 261.63);
      const pitchClass = ((Math.round(semis) % 12) + 12) % 12;
      const chromaticToScaleDegree = { 0: 0, 1: 0, 2: 1, 3: 1, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 5, 10: 5, 11: 6 };
      return chromaticToScaleDegree[pitchClass];
    }

    const BTN = "font-semibold text-[13px] border border-[#3a3d42] rounded-lg px-[13px] py-[7px] cursor-pointer text-[#e8eaed] bg-[#35383d] hover:bg-[#3f434a] active:translate-y-px disabled:opacity-45 disabled:cursor-not-allowed transition-colors";
    const BTN_PRIMARY = "bg-[#12897e] border-transparent hover:bg-[#0f9c8f]";
    const BTN_DANGER = "bg-[#a83a32] border-transparent hover:bg-[#c2443a]";
    const cx = (...xs) => xs.filter(Boolean).join(' ');

    function Bar({ note, index, barRef, onStrike }) {
      return html`
        <div class="flex flex-col items-center gap-3">
          <div
            ref=${barRef}
            class="bar w-[clamp(38px,5.6vw,54px)] rounded-[10px] cursor-pointer flex items-center justify-center [font-family:Georgia,'Times_New_Roman',serif] font-bold text-[26px] text-[#17181a] shadow-[0_3px_8px_rgba(0,0,0,.4)] transition-[filter,transform] duration-75 select-none [-webkit-tap-highlight-color:transparent] [touch-action:manipulation] hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-white focus-visible:outline-offset-[3px]"
            style=${{ backgroundColor: note.color, height: (310 - index * 16) + 'px' }}
            role="button"
            tabindex="0"
            aria-label=${`Bar ${index + 1}, note ${note.label || note.name}`}
            onPointerDown=${(e) => { e.preventDefault(); onStrike(index); }}
            onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onStrike(index); } }}
          >${note.label || note.name}</div>
          <div class="text-base text-[#cfd2d6] font-semibold">${index + 1}</div>
        </div>`;
    }

    function Xylophone({ barRefs, onStrike }) {
      return html`
        <div class="flex justify-center items-center gap-[clamp(6px,1.3vw,13px)]">
          ${NOTES.map((n, i) => html`<${Bar} key=${i} note=${n} index=${i} onStrike=${onStrike}
            barRef=${(el) => { barRefs.current[i] = el; }} />`)}
        </div>`;
    }

    function SoundToggle({ soundType, onChange }) {
      const opt = (id, label) => html`
        <button type="button" key=${id}
          class=${cx("font-semibold text-[13px] border-0 px-3 py-[7px] cursor-pointer transition-colors",
            id !== 'wood' && "border-r border-[#3a3d42]",
            soundType === id ? "bg-[#12897e] text-white" : "text-[#9aa0a6] bg-[#35383d] hover:bg-[#3f434a]")}
          onClick=${() => onChange(id)}>${label}</button>`;
      return html`
        <div class="flex border border-[#3a3d42] rounded-lg overflow-hidden" role="group" aria-label="Bar material">
          ${opt('metal', '🔔 Metal')}${opt('wood', '🪵 Wood')}
        </div>`;
    }

    // The gap after a note/rest, shown as clickable dots (one dot = REST_UNIT_SEC).
    // Click past the dots to grow the gap; click a dot to cut it back to that point.
    function GapDots({ n, li, ni, lyricMode, onSetSec, onGrow, onTip, onHideTip }) {
      const count = Math.max(1, Math.round(n.sec / REST_UNIT_SEC));
      const dots = [];
      for (let d = 0; d < count; d++) dots.push(d);
      return html`
        <span class="inline-flex items-center text-[#6f7479] text-[15px] font-bold tracking-[1px] cursor-pointer pr-1.5 pl-0.5 py-0.5 rounded-md hover:bg-[#35383d] hover:text-[#9aa0a6]"
          data-pos=${n.rest ? (li + '-' + ni) : undefined}
          onPointerMove=${(e) => {
            const dot = e.target.closest('[data-step]');
            const steps = dot ? +dot.dataset.step : count + 1;
            const cur = count * REST_UNIT_SEC;
            const delta = steps * REST_UNIT_SEC - cur;
            const text = delta === 0 ? cur.toFixed(1) + 's'
              : cur.toFixed(1) + (delta > 0 ? '+' : '-') + Math.abs(delta).toFixed(1) + 's';
            onTip(e.clientX, e.currentTarget.getBoundingClientRect().top, text);
          }}
          onPointerLeave=${onHideTip}
          onPointerDown=${(e) => {
            if (e.target !== e.currentTarget) return;
            e.stopPropagation();
            if (lyricMode) return;
            onGrow();
          }}
        >${dots.map(d => html`
          <span key=${d} data-step=${d + 1}
            onPointerDown=${(e) => { e.stopPropagation(); if (lyricMode) return; onSetSec((d + 1) * REST_UNIT_SEC); }}
          >·</span>`)}</span>`;
    }

    // One note chip: cursor placement in normal mode, lyric-range arming in lyric mode.
    function Chip({ n, li, ni, linked, lyricMode, selected, playing, onArm, onPlace }) {
      return html`
        <div
          class=${cx("chip w-6 h-6 rounded-md flex items-center justify-center text-[12.5px] font-bold text-white [text-shadow:0_1px_2px_rgba(0,0,0,.35)] flex-none cursor-pointer",
            linked && "lyric-linked", selected && "lyric-selecting", playing && "playing")}
          style=${{ background: NOTES[n.i].color }}
          data-pos=${li + '-' + ni}
          onPointerDown=${(e) => { e.stopPropagation(); lyricMode ? onArm(li, ni) : onPlace(li, ni); }}
        >${n.i + 1}</div>`;
    }

    function LyricCaption({ line, li, tags, lyricMode, playingTagKey, onLinkSelection, onUnlink, onCaptionDone }) {
      const wrapRef = useRef(null);
      const text = line.lyric || '';
      if (!text && !lyricMode) return null;

      const handleMouseUp = () => {
        const wrap = wrapRef.current;
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        if (!wrap.contains(range.commonAncestorContainer)) return;
        if (sel.isCollapsed) {
          const container = range.startContainer;
          const el = container.nodeType === 3 ? container.parentElement : container;
          const tagSpan = el && el.closest && el.closest('.lyric-tagged');
          if (tagSpan) onUnlink(li, +tagSpan.dataset.tagNote);
          return;
        }
        const a = textOffset(wrap, range.startContainer, range.startOffset);
        const b = textOffset(wrap, range.endContainer, range.endOffset);
        const charStart = Math.min(a, b), charEnd = Math.max(a, b);
        if (charEnd <= charStart) return;
        sel.removeAllRanges();
        onLinkSelection(li, charStart, charEnd);
      };
      const handleInput = () => {
        // free-typed edits can't be safely re-mapped onto the old offsets, so they void
        // this line's links rather than risk a link silently pointing at the wrong word
        line.lyric = wrapRef.current.textContent;
        stripLyricTags(line.notes);
      };

      const parts = [];
      let pos = 0;
      tags.forEach(t => {
        if (t.start > pos) parts.push(text.slice(pos, t.start));
        const key = li + '-' + t.noteIdx;
        parts.push(html`
          <span key=${key} class=${cx("lyric-tagged font-bold not-italic", lyricMode && "cursor-pointer", playingTagKey === key && "playing")}
            data-tag-note=${t.noteIdx}>${text.slice(t.start, t.end)}</span>`);
        pos = t.end;
      });
      if (pos < text.length) parts.push(text.slice(pos));

      return html`
        <div ref=${wrapRef}
          class=${cx("lyric text-[11.5px] text-[#84898e] italic mt-[3px]",
            lyricMode && "lyric-editable not-italic outline outline-1 outline-dashed outline-[#3a3d42] outline-offset-[3px] rounded cursor-text min-h-[14px]")}
          contentEditable=${lyricMode}
          suppressContentEditableWarning=${true}
          onPointerDown=${lyricMode ? (e) => e.stopPropagation() : undefined}
          onMouseUp=${lyricMode ? handleMouseUp : undefined}
          onInput=${lyricMode ? handleInput : undefined}
          onBlur=${lyricMode ? onCaptionDone : undefined}
        >${parts}</div>`;
    }

    function PadLine({ line, li, cursor, lyricMode, lyricSel, playingPos, playingTagKey, empty,
      onArmNote, onPlaceCursor, onSetGapSec, onGrowGap, onTip, onHideTip,
      onLinkSelection, onUnlink, onCaptionDone, onRowClick }) {
      const tags = collectLineTags(line);
      const items = [];
      line.notes.forEach((n, ni) => {
        if (li === cursor.line && ni === cursor.pos && !lyricMode) items.push(html`<span key=${'caret-' + ni} class="caret"></span>`);
        if (!n.rest) {
          const linked = tags.some(t => ni >= t.noteIdx && ni <= t.noteIdx + t.noteSpan - 1);
          const selected = !!(lyricMode && lyricSel && lyricSel.line === li && ni >= lyricSel.start && ni <= lyricSel.end);
          const playing = !!(playingPos && playingPos.li === li && playingPos.ni === ni);
          items.push(html`<${Chip} key=${'chip-' + ni} n=${n} li=${li} ni=${ni} linked=${linked} lyricMode=${lyricMode}
            selected=${selected} playing=${playing} onArm=${onArmNote} onPlace=${onPlaceCursor} />`);
        }
        items.push(html`<${GapDots} key=${'gap-' + ni} n=${n} li=${li} ni=${ni} lyricMode=${lyricMode}
          onSetSec=${(sec) => onSetGapSec(li, ni, sec)} onGrow=${() => onGrowGap(li, ni)}
          onTip=${onTip} onHideTip=${onHideTip} />`);
      });
      if (li === cursor.line && cursor.pos >= line.notes.length && !lyricMode) items.push(html`<span key="caret-end" class="caret"></span>`);
      if (empty) items.push(html`<span key="ph" class="text-[#6f7479] text-[12.5px] italic">Tap the bars to write your tune…</span>`);

      return html`
        <div class="py-[5px] border-b border-[#33363b] last:border-b-0"
          onPointerDown=${() => onRowClick(li)}>
          <div class=${cx("flex flex-wrap gap-[5px] items-center min-h-[26px]", lyricMode ? "cursor-default" : "cursor-text")}>${items}</div>
          <${LyricCaption} line=${line} li=${li} tags=${tags} lyricMode=${lyricMode} playingTagKey=${playingTagKey}
            onLinkSelection=${onLinkSelection} onUnlink=${onUnlink} onCaptionDone=${onCaptionDone} />
        </div>`;
    }

    function GapTooltip({ tip }) {
      if (!tip) return null;
      return ReactDOM.createPortal(
        html`<div class="fixed [transform:translate(-50%,calc(-100%-8px))] bg-[#111214] text-[#e8eaed] font-semibold text-[11px] px-1.5 py-0.5 rounded border border-[#3a3d42] pointer-events-none whitespace-nowrap z-50"
          style=${{ left: tip.x + 'px', top: tip.y + 'px' }}>${tip.text}</div>`,
        document.body);
    }

    function App() {
      const [, bump] = useReducer(x => x + 1, 0);
      const forceUpdate = useCallback(() => bump(), []);

      const S = useRef(null);
      if (!S.current) {
        S.current = {
          lines: [{ notes: [], lyric: '' }],
          cursor: { line: 0, pos: 0 },
          lastLiveNote: null,
          player: { events: [], idx: 0, timer: null, playing: false },
          playingPos: null,
          playingTagKey: null,
        };
      }
      const s = S.current;

      const [soundType, setSoundTypeState] = useState(loadSoundPref());
      const soundTypeRef = useRef(soundType);
      const [bpm, setBpm] = useState(100);
      const bpmRef = useRef(100);
      const [savedSongs, setSavedSongs] = useState(loadSavedSongs());
      const [currentSongName, setCurrentSongName] = useState(null);
      const [tuneValue, setTuneValue] = useState('');
      const [lyricMode, setLyricMode] = useState(false);
      const [lyricSel, setLyricSel] = useState(null);
      const [micRunning, setMicRunning] = useState(false);
      const [tip, setTip] = useState(null);

      const barRefs = useRef([]);
      const padRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => { document.body.dataset.material = soundType; }, [soundType]);

      // ---------- pad mutation helpers (mutate the ref, then re-render) ----------
      function scrollAfterRender(target) { s.scrollTarget = target; forceUpdate(); }

      function strike(i) {
        playNote(i, soundTypeRef.current, barRefs.current);
        finishPlayback();
        const now = performance.now();
        const atEnd = s.cursor.line === s.lines.length - 1 && s.cursor.pos === s.lines[s.cursor.line].notes.length;
        const continuesLive = atEnd && s.lastLiveNote && s.lastLiveNote.note === s.lines[s.cursor.line].notes[s.cursor.pos - 1];
        if (continuesLive) {
          const gapSec = (now - s.lastLiveNote.time) / 1000;
          s.lastLiveNote.note.sec = clamp(gapSec, MIN_LIVE_GAP_SEC, MAX_PAUSE_SEC);
          if (gapSec > PHRASE_BREAK_SEC) {
            s.lines.push({ notes: [], lyric: '' });
            s.cursor = { line: s.lines.length - 1, pos: 0 };
          }
        }
        const note = { i, sec: QUARTER_SEC };
        invalidateTagsAt(s.lines[s.cursor.line], s.cursor.pos);
        s.lines[s.cursor.line].notes.splice(s.cursor.pos, 0, note);
        s.cursor.pos++;
        s.lastLiveNote = atEnd ? { note, time: now } : null;
        scrollAfterRender({ type: 'caret' });
      }
      function newLine() {
        finishPlayback();
        s.lastLiveNote = null;
        invalidateTagsAt(s.lines[s.cursor.line], s.cursor.pos);
        const tail = s.lines[s.cursor.line].notes.splice(s.cursor.pos);
        stripLyricTags(tail);
        s.lines.splice(s.cursor.line + 1, 0, { notes: tail, lyric: '' });
        s.cursor = { line: s.cursor.line + 1, pos: 0 };
        scrollAfterRender({ type: 'caret' });
      }
      function backspace() {
        finishPlayback();
        s.lastLiveNote = null;
        const line = s.lines[s.cursor.line];
        if (s.cursor.pos > 0) {
          const n = line.notes[s.cursor.pos - 1];
          if (dotCount(n) > 1) { n.sec -= REST_UNIT_SEC; }
          else {
            invalidateTagsAt(line, s.cursor.pos - 1);
            line.notes.splice(s.cursor.pos - 1, 1);
            s.cursor.pos--;
          }
        } else if (s.cursor.line > 0) {
          const prev = s.lines[s.cursor.line - 1];
          s.cursor = { line: s.cursor.line - 1, pos: prev.notes.length };
          stripLyricTags(line.notes);
          prev.notes = prev.notes.concat(line.notes);
          s.lines.splice(s.cursor.line + 1, 1);
        }
        scrollAfterRender({ type: 'caret' });
      }
      function forwardDelete() {
        finishPlayback();
        s.lastLiveNote = null;
        const line = s.lines[s.cursor.line];
        if (s.cursor.pos < line.notes.length) {
          const n = line.notes[s.cursor.pos];
          if (dotCount(n) > 1) { n.sec -= REST_UNIT_SEC; }
          else { invalidateTagsAt(line, s.cursor.pos); line.notes.splice(s.cursor.pos, 1); }
        } else if (s.cursor.line < s.lines.length - 1) {
          stripLyricTags(s.lines[s.cursor.line + 1].notes);
          line.notes = line.notes.concat(s.lines[s.cursor.line + 1].notes);
          s.lines.splice(s.cursor.line + 1, 1);
        }
        scrollAfterRender({ type: 'caret' });
      }
      function hardDelete() {
        finishPlayback();
        s.lastLiveNote = null;
        const line = s.lines[s.cursor.line];
        if (s.cursor.pos < line.notes.length) {
          invalidateTagsAt(line, s.cursor.pos);
          line.notes.splice(s.cursor.pos, 1);
        } else if (s.cursor.line < s.lines.length - 1) {
          stripLyricTags(s.lines[s.cursor.line + 1].notes);
          line.notes = line.notes.concat(s.lines[s.cursor.line + 1].notes);
          s.lines.splice(s.cursor.line + 1, 1);
        }
        scrollAfterRender({ type: 'caret' });
      }
      function addDot() {
        if (s.cursor.pos === 0) return;
        finishPlayback();
        s.lastLiveNote = null;
        s.lines[s.cursor.line].notes[s.cursor.pos - 1].sec += REST_UNIT_SEC;
        scrollAfterRender({ type: 'caret' });
      }
      function moveCursor(key) {
        const len = () => s.lines[s.cursor.line].notes.length;
        if (key === 'ArrowLeft') {
          if (s.cursor.pos > 0) s.cursor.pos--;
          else if (s.cursor.line > 0) { s.cursor.line--; s.cursor.pos = len(); }
        } else if (key === 'ArrowRight') {
          if (s.cursor.pos < len()) s.cursor.pos++;
          else if (s.cursor.line < s.lines.length - 1) { s.cursor.line++; s.cursor.pos = 0; }
        } else if (key === 'ArrowUp') {
          if (s.cursor.line > 0) { s.cursor.line--; s.cursor.pos = Math.min(s.cursor.pos, len()); }
          else s.cursor.pos = 0;
        } else if (key === 'ArrowDown') {
          if (s.cursor.line < s.lines.length - 1) { s.cursor.line++; s.cursor.pos = Math.min(s.cursor.pos, len()); }
          else s.cursor.pos = len();
        } else if (key === 'Home') { s.cursor.pos = 0; }
        else if (key === 'End') { s.cursor.pos = len(); }
        scrollAfterRender({ type: 'caret' });
      }

      // ---------- lyric linking ----------
      function armNote(li, ni) {
        setLyricSel(prev => {
          if (!prev || prev.line !== li) return { line: li, start: ni, end: ni };
          return { line: li, start: Math.min(prev.start, ni), end: Math.max(prev.end, ni) };
        });
      }
      function placeCursor(li, ni) {
        s.cursor = { line: li, pos: ni + 1 };
        scrollAfterRender({ type: 'caret' });
      }
      function onLinkSelection(li, charStart, charEnd) {
        setLyricSel(sel => {
          if (!sel || sel.line !== li) return sel;
          linkLyricSelection(s.lines[li], sel.start, sel.end, charStart, charEnd);
          forceUpdate();
          return null;
        });
      }
      function onUnlink(li, noteIdx) {
        stripLyricTags([s.lines[li].notes[noteIdx]]);
        forceUpdate();
      }
      function onRowClick(li) {
        if (lyricMode) { setLyricSel(null); return; }
        s.cursor = { line: li, pos: s.lines[li].notes.length };
        scrollAfterRender({ type: 'caret' });
      }
      function toggleLyricMode() {
        setLyricMode(v => !v);
        setLyricSel(null);
      }

      // ---------- playback ----------
      function buildEvents() {
        const evs = [];
        s.lines.forEach((line, li) => {
          line.notes.forEach((n, ni) => evs.push({ li, ni, rest: !!n.rest, i: n.i, sec: n.sec }));
        });
        return evs;
      }
      function clearPlayingHighlight() { s.playingPos = null; s.playingTagKey = null; }
      function step() {
        if (s.player.idx >= s.player.events.length) { finishPlayback(); return; }
        const ev = s.player.events[s.player.idx];
        const speed = bpmRef.current / 100;
        const durMs = ev.sec * 1000 / speed;
        if (!ev.rest) playNote(ev.i, soundTypeRef.current, barRefs.current, 0, durMs * 0.9);
        clearPlayingHighlight();
        s.playingPos = { li: ev.li, ni: ev.ni };
        const tag = collectLineTags(s.lines[ev.li]).find(t => ev.ni >= t.noteIdx && ev.ni <= t.noteIdx + t.noteSpan - 1);
        if (tag) s.playingTagKey = ev.li + '-' + tag.noteIdx;
        s.player.idx++;
        s.player.timer = setTimeout(step, durMs);
        scrollAfterRender({ type: 'pos', key: ev.li + '-' + ev.ni });
      }
      function startOrResume() {
        if (s.player.playing) return;
        if (s.player.idx === 0) s.player.events = buildEvents();
        if (s.player.events.length === 0) return;
        s.player.playing = true;
        step();
      }
      function pausePlayback() {
        clearTimeout(s.player.timer);
        s.player.playing = false;
        forceUpdate();
      }
      function finishPlayback() {
        clearTimeout(s.player.timer);
        s.player.playing = false;
        s.player.idx = 0;
        clearPlayingHighlight();
        forceUpdate();
      }

      // scroll effect: runs after each commit, once
      useEffect(() => {
        const target = s.scrollTarget;
        s.scrollTarget = null;
        if (!target || !padRef.current) return;
        if (target.type === 'caret') {
          const el = padRef.current.querySelector('.caret');
          if (el) el.scrollIntoView({ block: 'nearest' });
        } else if (target.type === 'pos') {
          const el = padRef.current.querySelector(`[data-pos="${target.key}"]`);
          if (el) el.scrollIntoView({ block: 'nearest' });
        }
      });

      // ---------- songs / examples ----------
      function setCurrentSong(name) { setCurrentSongName(name); }
      function selectTuneOption(kind, name) { setTuneValue(kind ? kind + ':' + name : ''); }

      function doClear() {
        finishPlayback();
        s.lastLiveNote = null;
        s.lines = [{ notes: [], lyric: '' }];
        s.cursor = { line: 0, pos: 0 };
        setCurrentSong(null);
        selectTuneOption(null);
        scrollAfterRender({ type: 'caret' });
      }
      function onTuneChange(e) {
        const value = e.target.value;
        setTuneValue(value);
        if (!value) return;
        const [kind, name] = [value.slice(0, value.indexOf(':')), value.slice(value.indexOf(':') + 1)];
        finishPlayback();
        s.lastLiveNote = null;
        if (kind === 'song') {
          s.lines = cloneLines(savedSongs[name].lines);
          setCurrentSong(name);
        } else {
          s.lines = EXAMPLES[name].map(l => ({ notes: parseLine(l.n), lyric: l.t || '' }));
          setCurrentSong(null);
        }
        s.cursor = { line: s.lines.length - 1, pos: s.lines[s.lines.length - 1].notes.length };
        scrollAfterRender({ type: 'caret' });
        e.target.blur();
      }
      function saveSong() {
        if (!hasNotes(s.lines)) { alert('Play or write some notes before saving a song.'); return; }
        const name = prompt('Song name:', currentSongName || '');
        if (name === null) return;
        const trimmed = name.trim();
        if (!trimmed) return;
        if (savedSongs[trimmed] && trimmed !== currentSongName) {
          if (!confirm(`"${trimmed}" already exists. Overwrite it?`)) return;
        }
        const next = { ...savedSongs, [trimmed]: { lines: cloneLines(s.lines) } };
        setSavedSongs(next);
        persistSavedSongs(next);
        setCurrentSong(trimmed);
        selectTuneOption('song', trimmed);
      }
      function deleteSong() {
        if (!currentSongName) return;
        if (!confirm(`Delete "${currentSongName}"?`)) return;
        const next = { ...savedSongs };
        delete next[currentSongName];
        setSavedSongs(next);
        persistSavedSongs(next);
        setCurrentSong(null);
        selectTuneOption(null);
        finishPlayback();
        s.lastLiveNote = null;
        s.lines = [{ notes: [], lyric: '' }];
        s.cursor = { line: 0, pos: 0 };
        scrollAfterRender({ type: 'caret' });
      }
      function loadDetected(detected) {
        finishPlayback();
        s.lastLiveNote = null;
        s.lines = [{ notes: [], lyric: '' }];
        setCurrentSong(null);
        selectTuneOption(null);
        detected.forEach((d, k) => {
          const next = detected[k + 1];
          const gap = next ? next.t - d.t : QUARTER_SEC;
          if (s.lines[s.lines.length - 1].notes.length >= 8) s.lines.push({ notes: [], lyric: '' });
          s.lines[s.lines.length - 1].notes.push({ i: d.i, sec: clamp(gap, MIN_LIVE_GAP_SEC, MAX_PAUSE_SEC) });
          if (next && gap > PHRASE_BREAK_SEC) s.lines.push({ notes: [], lyric: '' });
        });
        s.cursor = { line: s.lines.length - 1, pos: s.lines[s.lines.length - 1].notes.length };
        scrollAfterRender({ type: 'caret' });
      }

      // ---------- mic humming ----------
      const micStateRef = useRef({ stream: null, analyser: null, raf: null, lastNote: -1, stableCount: 0, lastAddTime: 0, lastNoteRef: null });
      async function startMic() {
        let stream;
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch { alert("Couldn't access the microphone. Check the browser's permission settings."); return; }
        const ac = ctx();
        const micSource = ac.createMediaStreamSource(stream);
        const analyser = ac.createAnalyser();
        analyser.fftSize = 2048;
        micSource.connect(analyser);
        const m = micStateRef.current;
        m.stream = stream; m.analyser = analyser;
        m.lastNote = -1; m.stableCount = 0; m.lastAddTime = 0; m.lastNoteRef = null;
        setMicRunning(true);
        finishPlayback();
        s.lastLiveNote = null;
        s.lines = [{ notes: [], lyric: '' }];
        s.cursor = { line: 0, pos: 0 };
        setCurrentSong(null);
        selectTuneOption(null);
        scrollAfterRender({ type: 'caret' });
        const buf = new Float32Array(analyser.fftSize);
        function loop() {
          const mm = micStateRef.current;
          if (!mm.stream) return;
          mm.analyser.getFloatTimeDomainData(buf);
          const freq = autoCorrelate(buf, ac.sampleRate);
          if (freq > 0 && freq < 1200) {
            const idx = freqToNoteIndex(freq);
            if (idx === mm.lastNote) { mm.stableCount++; } else { mm.lastNote = idx; mm.stableCount = 1; }
            const now = performance.now();
            if (mm.stableCount === 4 && now - mm.lastAddTime > 280) {
              if (mm.lastNoteRef) {
                const gapSec = (now - mm.lastAddTime) / 1000;
                mm.lastNoteRef.sec = clamp(gapSec, MIN_LIVE_GAP_SEC, MAX_PAUSE_SEC);
                if (gapSec > PHRASE_BREAK_SEC) s.lines.push({ notes: [], lyric: '' });
              }
              const cur = s.lines[s.lines.length - 1];
              if (cur.notes.length >= 8) s.lines.push({ notes: [], lyric: '' });
              const note = { i: idx, sec: QUARTER_SEC };
              s.lines[s.lines.length - 1].notes.push(note);
              mm.lastNoteRef = note;
              s.cursor = { line: s.lines.length - 1, pos: s.lines[s.lines.length - 1].notes.length };
              scrollAfterRender({ type: 'caret' });
              playNote(idx, soundTypeRef.current, barRefs.current);
              mm.lastAddTime = now;
            }
          }
          mm.raf = requestAnimationFrame(loop);
        }
        loop();
      }
      function stopMic() {
        const m = micStateRef.current;
        if (m.raf) cancelAnimationFrame(m.raf);
        if (m.stream) m.stream.getTracks().forEach(t => t.stop());
        m.stream = null;
        setMicRunning(false);
      }
      function onMicClick() { micRunning ? stopMic() : startMic(); }

      async function onFileChange(e) {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const ac = ctx();
          const arrayBuf = await file.arrayBuffer();
          const audioBuf = await ac.decodeAudioData(arrayBuf);
          const channel = audioBuf.getChannelData(0);
          const sr = audioBuf.sampleRate;
          const winSize = 2048, hop = 1024;
          const detected = [];
          let lastN = -1, stable = 0;
          for (let start = 0; start + winSize < channel.length; start += hop) {
            const frame = channel.subarray(start, start + winSize);
            const freq = autoCorrelate(frame, sr);
            if (freq > 60 && freq < 1200) {
              const idx = freqToNoteIndex(freq);
              if (idx === lastN) { stable++; } else { lastN = idx; stable = 1; }
              if (stable === 3) {
                const t = start / sr;
                if (detected.length === 0 || detected[detected.length - 1].i !== idx) detected.push({ i: idx, t });
              }
            } else { lastN = -1; stable = 0; }
            if (detected.length >= 48) break;
          }
          if (detected.length === 0) {
            alert("Couldn't find a clear melody. Songs with many instruments are hard to read; try a hummed or a cappella recording.");
          } else {
            loadDetected(detected);
          }
        } catch (err) {
          alert("Couldn't read that audio file. MP3 or WAV work best.");
        }
        e.target.value = '';
      }

      // ---------- keyboard ----------
      useEffect(() => {
        function onKeyDown(e) {
          const tagName = e.target.tagName;
          if (tagName === 'INPUT' || tagName === 'SELECT' || tagName === 'TEXTAREA' || tagName === 'BUTTON') return;
          if (e.target.isContentEditable) return;
          if (e.target.classList && e.target.classList.contains('bar') && (e.key === 'Enter' || e.key === ' ')) return;
          if (lyricMode) {
            if (e.key === 'Escape' && lyricSel) { e.preventDefault(); setLyricSel(null); }
            return;
          }
          if (e.key >= '1' && e.key <= '8') { if (!e.repeat) strike(+e.key - 1); }
          else if (e.key === 'Enter') { if (!e.repeat) newLine(); }
          else if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
          else if (e.key === 'Delete' && e.shiftKey) { e.preventDefault(); hardDelete(); }
          else if (e.key === 'Delete') { forwardDelete(); }
          else if (e.key === ' ' || e.key === '.') { e.preventDefault(); addDot(); }
          else if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) {
            e.preventDefault();
            moveCursor(e.key);
          }
        }
        document.addEventListener('keydown', onKeyDown);
        return () => document.removeEventListener('keydown', onKeyDown);
      });

      // legend bar height sync (keeps body padding clear of the fixed footer)
      const legendRef = useRef(null);
      useEffect(() => {
        function sync() { if (legendRef.current) document.body.style.paddingBottom = (legendRef.current.offsetHeight + 14) + 'px'; }
        sync();
        window.addEventListener('resize', sync);
        return () => window.removeEventListener('resize', sync);
      });

      const empty = s.lines.length === 1 && s.lines[0].notes.length === 0;
      const playing = s.player.playing;
      const playLabel = playing ? '⏸ Pause' : (s.player.idx > 0 ? '▶ Resume' : '▶ Play');
      const noNotes = !hasNotes(s.lines);

      const savedNames = Object.keys(savedSongs).sort((a, b) => a.localeCompare(b));

      return html`
        <div class="max-w-[1120px] mx-auto">
          <header class="flex items-center justify-between gap-3 flex-wrap mb-3.5">
            <h1 class="text-[18px] font-bold m-0 tracking-[.2px]">Tune to Xylophone</h1>
            <div class="flex gap-2 flex-wrap items-center">
              <button class=${cx(BTN, micRunning && BTN_DANGER)} onClick=${onMicClick}>${micRunning ? '⏹ Stop' : '🎤 Hum it'}</button>
              <button class=${BTN} onClick=${() => fileInputRef.current.click()}>📁 Upload</button>
              <input ref=${fileInputRef} type="file" accept="audio/*" class="hidden" onChange=${onFileChange} />
              <select class="font-semibold text-[13px] px-2.5 py-[7px] rounded-lg border border-[#3a3d42] bg-[#35383d] text-[#e8eaed]"
                value=${tuneValue} onChange=${onTuneChange}>
                <option value="">Pick a tune…</option>
                <optgroup label="Built-in">
                  ${Object.keys(EXAMPLES).map(name => html`<option key=${name} value=${'example:' + name}>${name}</option>`)}
                </optgroup>
                ${savedNames.length ? html`<optgroup label="My Songs">
                  ${savedNames.map(name => html`<option key=${name} value=${'song:' + name}>${name}</option>`)}
                </optgroup>` : null}
              </select>
            </div>
          </header>

          <div class="grid grid-cols-1 min-[880px]:grid-cols-2 gap-4 items-start">
            <section class="order-1 min-[880px]:order-2 bg-[#2a2d31] border border-[#3a3d42] rounded-[10px] p-3">
              <div class="flex items-start justify-between gap-2 flex-wrap mb-2.5">
                <div class="flex items-center gap-2 flex-wrap">
                  <button class=${cx(BTN, BTN_PRIMARY)} disabled=${noNotes}
                    onClick=${(e) => { e.currentTarget.blur(); playing ? pausePlayback() : startOrResume(); }}>${playLabel}</button>
                  <button class=${BTN} disabled=${noNotes} title="Restart from the beginning" aria-label="Restart"
                    onClick=${(e) => { e.currentTarget.blur(); finishPlayback(); startOrResume(); }}>⏮</button>
                  <button class=${BTN} onClick=${doClear}>✕ Clear</button>
                  <button class=${cx(BTN, lyricMode && BTN_PRIMARY)} title="Tag notes with lyrics" onClick=${toggleLyricMode}>📝 Lyrics</button>
                  <div class="flex items-center gap-1.5 text-[13px]">
                    <span class="font-semibold min-w-[50px]">Speed ${bpm}%</span>
                    <input type="range" min="50" max="200" step="10" value=${bpm} class="w-[90px] accent-[#12897e]"
                      onInput=${(e) => { const v = +e.target.value; bpmRef.current = v; setBpm(v); }} />
                  </div>
                </div>
                <button class=${cx(BTN, BTN_DANGER)} disabled=${!currentSongName} title="Delete the loaded song" onClick=${deleteSong}>🗑 Delete</button>
              </div>
              <div ref=${padRef} class="min-h-[420px] max-h-[520px] overflow-y-auto px-1 py-0.5">
                ${s.lines.map((line, li) => html`<${PadLine} key=${li} line=${line} li=${li} cursor=${s.cursor}
                  lyricMode=${lyricMode} lyricSel=${lyricSel} playingPos=${s.playingPos} playingTagKey=${s.playingTagKey}
                  empty=${empty && li === 0}
                  onArmNote=${armNote} onPlaceCursor=${placeCursor}
                  onSetGapSec=${(li2, ni2, sec) => { if (lyricMode) return; finishPlayback(); s.lastLiveNote = null; s.lines[li2].notes[ni2].sec = sec; forceUpdate(); }}
                  onGrowGap=${(li2, ni2) => { if (lyricMode) return; finishPlayback(); s.lastLiveNote = null; s.lines[li2].notes[ni2].sec += REST_UNIT_SEC; forceUpdate(); }}
                  onTip=${(x, y, text) => setTip({ x, y, text })} onHideTip=${() => setTip(null)}
                  onLinkSelection=${onLinkSelection} onUnlink=${onUnlink} onCaptionDone=${forceUpdate}
                  onRowClick=${onRowClick} />`)}
              </div>
              <div class="flex justify-end mt-2.5">
                <button class=${BTN} onClick=${saveSong}>💾 Save</button>
              </div>
            </section>

            <section class="order-2 min-[880px]:order-1 flex flex-col justify-center items-center gap-5 min-h-[520px]">
              <${Xylophone} barRefs=${barRefs} onStrike=${strike} />
              <${SoundToggle} soundType=${soundType} onChange=${(v) => { soundTypeRef.current = v; saveSoundPref(v); setSoundTypeState(v); }} />
            </section>
          </div>

          <${GapTooltip} tip=${tip} />

          <footer ref=${legendRef} class="fixed inset-x-0 bottom-0 bg-[#2a2d31] border-t border-[#3a3d42] px-4 py-2.5 text-[12.5px] text-[#9aa0a6] leading-[1.7] text-center shadow-[0_-6px_16px_rgba(0,0,0,.35)] z-40">
            <kbd class="font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]">1</kbd>–<kbd class="font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]">8</kbd> write a note · 
            <kbd class="font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]">Enter</kbd> new line · 
            <kbd class="font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]">⌫</kbd> delete a dot, or the note once its dots run out · 
            <kbd class="font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]">Space</kbd>/<kbd class="font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]">.</kbd> add a dot · 
            <kbd class="font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]">⇧</kbd><kbd class="font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]">Del</kbd> delete a note and its dots · arrow keys or click to move the cursor
            <div class="mt-1 italic text-[#9aa0a6]">The dots after each note are the gap before the next one (hover for the exact
              time). Click past the dots to add one, click a dot to cut the gap back to that point. Play bars one
              after another at the end of the pad and your real timing is recorded automatically, pause more than a
              beat and a new line starts on its own. Turn on 📝 Lyrics to type or edit the words below a line, then
              click a note (click more to grow the group) and drag-select the matching word(s) to link them - the
              linked word lights up when its note plays. Click a linked word to unlink it,
              <kbd class="font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]">Esc</kbd> to drop an armed note selection.</div>
          </footer>
        </div>`;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>

</html>
