<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xylotune</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
  <style>
    :root {
      --c1: #d63c30;
      /* C  red */
      --c2: #ee9421;
      /* D  orange */
      --c3: #e6bd1c;
      /* E  gold */
      --c4: #4ba54f;
      /* F  green */
      --c5: #12897e;
      /* G  teal */
      --c6: #189ad3;
      /* A  blue */
      --c7: #6a3fae;
      /* B  purple */
      --c8: #d84941;
      /* C' red */
    }

    /* Wood material: swaps the rainbow bar/chip palette for an oak-to-walnut gradient. */
    body[data-material="wood"] {
      --c1: hsl(32, 42%, 62%);
      --c2: hsl(31, 42%, 59%);
      --c3: hsl(30, 43%, 55%);
      --c4: hsl(28, 43%, 52%);
      --c5: hsl(27, 44%, 48%);
      --c6: hsl(25, 45%, 45%);
      --c7: hsl(24, 46%, 41%);
      --c8: hsl(22, 47%, 38%);
    }

    body[data-material="wood"] .bar {
      background-image:
        repeating-linear-gradient(180deg,
          rgba(0, 0, 0, .08) 0px, rgba(0, 0, 0, .08) 1px,
          transparent 1px, transparent 5px,
          rgba(255, 255, 255, .05) 5px, rgba(255, 255, 255, .05) 6px,
          transparent 6px, transparent 13px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .15);
    }

    /* Re-added and reflow-forced on every strike (see playNote) so two fast presses of the
       same bar restart the animation from frame 0 instead of blending into one held flash. */
    .bar.active {
      animation: barStrike var(--strike-dur, 180ms) cubic-bezier(.2, .9, .3, 1);
    }

    @keyframes barStrike {
      0% {
        background-color: color-mix(in srgb, var(--bar-color) 45%, white 55%);
        filter: brightness(1.25);
        transform: scale(.92);
      }

      100% {
        background-color: var(--bar-color);
        filter: brightness(1);
        transform: scale(1);
      }
    }

    /* Practice mode: a persistent glow on the one bar to strike next, distinct from the
       transient .active strike flash so the two can be visible at once. */
    .bar.target {
      outline: 3px solid #fff;
      outline-offset: 3px;
      animation: barTargetPulse 1.1s ease-in-out infinite;
    }

    @keyframes barTargetPulse {

      0%,
      100% {
        filter: brightness(1);
      }

      50% {
        filter: brightness(1.35);
      }
    }

    .chip.playing {
      outline: 2px solid #fff;
      transform: scale(1.12);
    }

    .chip.lyric-linked {
      border-bottom: 3px solid var(--c5);
    }

    .chip.lyric-selecting {
      outline: 2px dashed #fff;
      outline-offset: 1px;
    }

    .lyric-tagged {
      border-bottom: 2px solid var(--c5);
    }

    .lyric-tagged.playing {
      background: var(--c5);
      color: #fff;
      border-radius: 3px;
      padding: 0 2px;
    }

    .lyric-editable:empty::before {
      content: 'Click to add lyrics…';
      opacity: .5;
      font-style: italic;
    }

    .caret {
      display: inline-block;
      width: 2px;
      height: 18px;
      background: #e8eaed;
      animation: blink 1.1s steps(1) infinite;
    }

    /* Pulls the caret back over the gap-dots' own trailing padding, so it sits right next to them. */
    .caret-tight {
      margin-left: -10px;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }

      .bar.active {
        background-color: color-mix(in srgb, var(--bar-color) 55%, white 45%);
        filter: brightness(1.25);
        transform: none;
      }

      .chip.playing {
        transform: none;
      }

      .caret {
        opacity: 1;
      }
    }
  </style>
</head>

<body
  class="m-0 h-screen overflow-hidden bg-[#212326] text-[#e8eaed] [font-family:-apple-system,'Segoe_UI',Roboto,sans-serif] px-4 py-[14px] flex flex-col">
  <div id="root" class="flex-1 min-h-0 flex flex-col"></div>

  <script>
    const html = htm.bind(React.createElement);
    const { useState, useRef, useEffect, useReducer, useCallback } = React;

    // ---------- 8-note diatonic set, C5 to C6 (bright toy-xylophone register) ----------
    const NOTES = [
      { name: 'C', freq: 523.25, color: 'var(--c1)' },
      { name: 'D', freq: 587.33, color: 'var(--c2)' },
      { name: 'E', freq: 659.26, color: 'var(--c3)' },
      { name: 'F', freq: 698.46, color: 'var(--c4)' },
      { name: 'G', freq: 783.99, color: 'var(--c5)' },
      { name: 'A', freq: 880.00, color: 'var(--c6)' },
      { name: 'B', freq: 987.77, color: 'var(--c7)' },
      { name: 'C2', freq: 1046.5, color: 'var(--c8)', label: 'C' },
    ];

    // ---------- Sound: struck metal/wood bar (modal synthesis) ----------
    let audioCtx = null, bus = null;
    function ctx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.ratio.value = 6;
        comp.connect(audioCtx.destination);
        bus = audioCtx.createGain();
        bus.gain.value = 0.85;
        bus.connect(comp);
      }
      return audioCtx;
    }
    let noiseBuffer = null;
    function getNoiseBuffer(ac) {
      if (noiseBuffer) return noiseBuffer;
      const len = ac.sampleRate * 0.03;
      noiseBuffer = ac.createBuffer(1, len, ac.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      return noiseBuffer;
    }
    // metal: long, bright, shimmering ring (detuned mode pair beats against itself).
    // wood: marimba-style undercut-tuned partials, fast dry decay, low mallet "thock".
    const SOUND_PROFILES = {
      metal: {
        modes: [
          { ratio: 1.000, gain: 0.55, decay: 1.5 },
          { ratio: 1.004, gain: 0.28, decay: 1.3 },
          { ratio: 2.756, gain: 0.20, decay: 0.60 },
          { ratio: 5.404, gain: 0.11, decay: 0.30 },
          { ratio: 8.933, gain: 0.05, decay: 0.16 },
        ],
        noise: { freqMul: 2.5, gain: 0.22, decay: 0.012 },
        lowpass: null,
      },
      wood: {
        modes: [
          { ratio: 1.000, gain: 0.70, decay: 0.35 },
          { ratio: 3.932, gain: 0.16, decay: 0.20 },
          { ratio: 9.538, gain: 0.05, decay: 0.09 },
        ],
        noise: { freqMul: 1.1, gain: 0.40, decay: 0.02 },
        lowpass: 3400,
      },
    };
    function playNote(i, soundType, barEls, when = 0, holdMs = 180) {
      const ac = ctx();
      const t0 = ac.currentTime + when;
      const freq = NOTES[i].freq * (1 + (Math.random() - 0.5) * 0.002);
      const profile = SOUND_PROFILES[soundType];
      const out = ac.createGain();
      out.gain.value = 1;
      const dest = out;
      let chainEnd = out;
      if (profile.lowpass) {
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = profile.lowpass;
        out.connect(lp);
        chainEnd = lp;
      }
      if (ac.createStereoPanner) {
        const pan = ac.createStereoPanner();
        pan.pan.value = (i / 7 - 0.5) * 0.6;
        chainEnd.connect(pan); pan.connect(bus);
      } else {
        chainEnd.connect(bus);
      }
      profile.modes.forEach(m => {
        const osc = ac.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq * m.ratio;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(m.gain, t0 + 0.0015);
        g.gain.setTargetAtTime(0.0001, t0 + 0.0015, m.decay / 6);
        osc.connect(g); g.connect(dest);
        osc.start(t0);
        osc.stop(t0 + m.decay + 0.3);
      });
      const noise = ac.createBufferSource();
      noise.buffer = getNoiseBuffer(ac);
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = freq * profile.noise.freqMul;
      bp.Q.value = 1.0;
      const ng = ac.createGain();
      ng.gain.setValueAtTime(profile.noise.gain, t0);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + profile.noise.decay);
      noise.connect(bp); bp.connect(ng); ng.connect(dest);
      noise.start(t0);
      noise.stop(t0 + profile.noise.decay + 0.02);

      const el = barEls && barEls[i];
      if (el) {
        setTimeout(() => {
          // Two strikes on the same bar within `holdMs` (a real double press, not OS
          // key-repeat) would otherwise share one 'active' class: the second add is a
          // no-op since the class is already set, and the first strike's removal timer
          // would then cut the second flash short. Tagging each strike and restarting the
          // CSS animation via remove/reflow/add makes every press its own visible pulse.
          const strikeId = (el._strikeId = (el._strikeId || 0) + 1);
          el.style.setProperty('--strike-dur', holdMs + 'ms');
          el.classList.remove('active');
          void el.offsetWidth; // force reflow so the animation restarts from frame 0
          el.classList.add('active');
          setTimeout(() => { if (el._strikeId === strikeId) el.classList.remove('active'); }, holdMs);
        }, Math.max(0, when * 1000));
      }
    }
    function loadSoundPref() {
      try { return localStorage.getItem('xyloSound') === 'wood' ? 'wood' : 'metal'; }
      catch { return 'metal'; }
    }
    function saveSoundPref(v) {
      try { localStorage.setItem('xyloSound', v); } catch { /* ignore, e.g. storage disabled */ }
    }

    // ---------- The pad's data model: lines of notes, edited like text ----------
    // lines = [{notes:[{i,sec} | {rest:true,sec}], lyric:''}]
    // sec = seconds to hold before the next event starts. Captured from real elapsed time
    // when a note is played live; a fixed default otherwise. Explicitly growing or shrinking
    // a gap's dots always lands on an exact multiple of REST_UNIT_SEC, matching what the
    // dots themselves display.
    // cursor sits before notes[pos] on lines[line], like a text caret
    const QUARTER_SEC = 0.4;
    const REST_UNIT_SEC = QUARTER_SEC / 4;
    const MIN_LIVE_GAP_SEC = 0.06;
    const PHRASE_BREAK_SEC = 1.2;
    const MAX_PAUSE_SEC = 1.6;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const dotCount = (n) => Math.max(1, Math.round(n.sec / REST_UNIT_SEC));
    const hasNotes = (lines) => lines.some(l => l.notes.some(n => !n.rest));

    // ---------- Lyric annotations: link a note or a run of notes to a stretch of a line's words ----------
    // A link is anchored on its first note: note.lyricStart/lyricEnd are character offsets into
    // the line's own `lyric` text, note.lyricSpan is how many consecutive notes (this one
    // included) it covers. Anchoring on the note object itself (not an index) means the link
    // rides along automatically when notes before it are inserted, deleted, or reordered.
    function collectLineTags(line) {
      const tags = [];
      line.notes.forEach((n, ni) => {
        if (n.lyricStart !== undefined) tags.push({ start: n.lyricStart, end: n.lyricEnd, noteIdx: ni, noteSpan: n.lyricSpan || 1 });
      });
      tags.sort((a, b) => a.start - b.start);
      return tags;
    }
    function stripLyricTags(notesArr) {
      notesArr.forEach(n => { delete n.lyricStart; delete n.lyricEnd; delete n.lyricSpan; });
    }
    // Insertion/removal at `pos` (pre-mutation index) can only corrupt a link whose span
    // strictly contains it - before its anchor the link is unaffected (rides with the anchor
    // object), and removing the anchor itself already self-heals via collectLineTags.
    function invalidateTagsAt(line, pos) {
      collectLineTags(line).forEach(t => {
        if (pos > t.noteIdx && pos <= t.noteIdx + t.noteSpan - 1) stripLyricTags([line.notes[t.noteIdx]]);
      });
    }
    // A new link overwrites any existing link that overlaps it on either axis - the note
    // range or the text range - so a partial overwrite can't leave a stale, half-matching link.
    function clearTagOverlap(line, noteStart, noteEnd, charStart, charEnd) {
      collectLineTags(line).forEach(t => {
        const noteOverlap = t.noteIdx <= noteEnd && t.noteIdx + t.noteSpan - 1 >= noteStart;
        const charOverlap = t.start < charEnd && t.end > charStart;
        if (noteOverlap || charOverlap) stripLyricTags([line.notes[t.noteIdx]]);
      });
    }
    function linkLyricSelection(line, noteStart, noteEnd, charStart, charEnd) {
      clearTagOverlap(line, noteStart, noteEnd, charStart, charEnd);
      const anchor = line.notes[noteStart];
      anchor.lyricStart = charStart;
      anchor.lyricEnd = charEnd;
      anchor.lyricSpan = noteEnd - noteStart + 1;
    }
    // ---------- Saved songs: your own tunes, kept in localStorage ----------
    function loadSavedSongs() {
      try { return JSON.parse(localStorage.getItem('xyloSongs')) || {}; }
      catch { return {}; }
    }
    function persistSavedSongs(songs) {
      try { localStorage.setItem('xyloSongs', JSON.stringify(songs)); }
      catch { /* ignore, e.g. storage disabled */ }
    }
    // Snaps sec to the same 0.1s dot grid the dot editor already uses, so a note captured
    // live (raw elapsed time) ends up stored with the exact value its dots display.
    function cloneLines(ls) {
      return ls.map(l => ({ lyric: l.lyric, notes: l.notes.map(n => ({ ...n, sec: dotCount(n) * REST_UNIT_SEC })) }));
    }

    // ---------- Google Drive sync: one JSON file in the user's own Drive ----------
    // Scoped to drive.file (only files this app itself creates/opens, never full Drive
    // access), authorized via Google Identity Services' implicit token flow - no server,
    // no refresh token on disk. The access token lives in memory only, for this tab.
    // Each song carries its own updatedAt; deletions leave a tombstone (deletedAt) rather
    // than just vanishing, so merging two devices' state is a plain per-song "latest
    // timestamp wins" instead of a full-file overwrite that could resurrect a deleted song
    // or clobber an edit made offline on the other device.
    const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
    const DRIVE_SYNC_FILENAME = 'xylotune-songs.json';
    const GIS_SCRIPT_URL = 'https://accounts.google.com/gsi/client';

    function loadDriveClientId() {
      try { return localStorage.getItem('xyloDriveClientId') || ''; }
      catch { return ''; }
    }
    function saveDriveClientId(id) {
      try { localStorage.setItem('xyloDriveClientId', id); }
      catch { /* ignore, e.g. storage disabled */ }
    }
    function loadDriveConnected() {
      try { return localStorage.getItem('xyloDriveConnected') === '1'; }
      catch { return false; }
    }
    function saveDriveConnected(v) {
      try { v ? localStorage.setItem('xyloDriveConnected', '1') : localStorage.removeItem('xyloDriveConnected'); }
      catch { /* ignore */ }
    }
    function loadTombstones() {
      try { return JSON.parse(localStorage.getItem('xyloTombstones')) || {}; }
      catch { return {}; }
    }
    function persistTombstones(t) {
      try { localStorage.setItem('xyloTombstones', JSON.stringify(t)); }
      catch { /* ignore */ }
    }

    // Loaded lazily, only when the user actually tries to connect - mirrors how Basic
    // Pitch is loaded below, so opening the app never pulls in Google's script or makes
    // any network request on its own.
    let gisPromise = null;
    function loadGoogleIdentity() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
      if (gisPromise) return gisPromise;
      gisPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = GIS_SCRIPT_URL;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("Couldn't load Google's sign-in library. Check your connection."));
        document.head.appendChild(script);
      });
      gisPromise.catch(() => { gisPromise = null; });
      return gisPromise;
    }

    let driveTokenClient = null;
    let driveAccessToken = null;
    function initDriveTokenClient(clientId) {
      driveTokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId, scope: DRIVE_SCOPE, callback: () => { } });
    }
    function requestDriveToken(promptMode) {
      return new Promise((resolve, reject) => {
        driveTokenClient.callback = (resp) => {
          if (resp.error) { reject(new Error(resp.error)); return; }
          driveAccessToken = resp.access_token;
          resolve(driveAccessToken);
        };
        driveTokenClient.error_callback = (err) => reject(new Error((err && err.type) || 'Google sign-in was cancelled'));
        driveTokenClient.requestAccessToken({ prompt: promptMode });
      });
    }
    // One retry on a 401, via a silent (no popup) token refresh - covers the token simply
    // expiring mid-session without bothering the user for a fresh consent.
    async function driveFetch(path, options = {}, retry = true) {
      const res = await fetch(path, { ...options, headers: { ...(options.headers || {}), Authorization: `Bearer ${driveAccessToken}` } });
      if (res.status === 401 && retry) {
        await requestDriveToken('');
        return driveFetch(path, options, false);
      }
      if (!res.ok) throw new Error(`Drive request failed (${res.status})`);
      return res;
    }
    async function findSyncFileId() {
      const q = encodeURIComponent(`name='${DRIVE_SYNC_FILENAME}' and trashed=false`);
      const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id)`);
      const data = await res.json();
      return data.files && data.files[0] ? data.files[0].id : null;
    }
    async function downloadSyncFile(fileId) {
      const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
      return res.json();
    }
    async function uploadSyncFile(fileId, body) {
      const json = JSON.stringify(body);
      if (fileId) {
        await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: json,
        });
        return fileId;
      }
      const metadata = { name: DRIVE_SYNC_FILENAME, mimeType: 'application/json' };
      const boundary = 'xylotune-boundary';
      const multipartBody =
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`;
      const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, {
        method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body: multipartBody,
      });
      const data = await res.json();
      return data.id;
    }
    // Per song: the side with the latest event (a save or a delete) wins. A name can only
    // ever be a live song on one side and a tombstone on the other (or both/neither), never
    // both a song and a tombstone on the same side, so there's no ambiguity to break.
    function mergeSyncState(localSongs, localTombstones, remote) {
      const remoteSongs = (remote && remote.songs) || {};
      const remoteTombstones = (remote && remote.tombstones) || {};
      const names = new Set([...Object.keys(localSongs), ...Object.keys(remoteSongs), ...Object.keys(localTombstones), ...Object.keys(remoteTombstones)]);
      const songs = {}, tombstones = {};
      names.forEach(name => {
        const lu = localSongs[name] ? (localSongs[name].updatedAt || 0) : -1;
        const ru = remoteSongs[name] ? (remoteSongs[name].updatedAt || 0) : -1;
        const ld = localTombstones[name] || -1;
        const rd = remoteTombstones[name] || -1;
        const latest = Math.max(lu, ru, ld, rd);
        if (latest < 0) return;
        if (latest === ld || latest === rd) tombstones[name] = Math.max(ld, rd);
        else songs[name] = latest === lu ? localSongs[name] : remoteSongs[name];
      });
      return { songs, tombstones };
    }

    // ---------- Getting songs in: transcription via Basic Pitch ----------
    // Loaded lazily, once, on first use: it pulls in TensorFlow.js and a few MB of model
    // weights from jsdelivr, so nothing downloads until a hum actually needs it. Polyphonic
    // and instrument-agnostic, and runs entirely in the browser, no server involved - though
    // in practice a hummed single voice, with nothing else in the recording to confuse the
    // reduction engine's melody-picking, is what actually transcribes cleanly onto 8 bars.
    const BASIC_PITCH_VERSION = '1.0.1';
    const BASIC_PITCH_ESM_URL = `https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@${BASIC_PITCH_VERSION}/+esm`;
    const BASIC_PITCH_MODEL_URL = `https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@${BASIC_PITCH_VERSION}/model/model.json`;
    const TRANSCRIBE_SAMPLE_RATE = 22050; // basic-pitch's model is fixed to this rate, mono

    let basicPitchPromise = null;
    function loadBasicPitch() {
      if (basicPitchPromise) return basicPitchPromise;
      const p = import(BASIC_PITCH_ESM_URL).then(mod => ({
        outputToNotesPoly: mod.outputToNotesPoly,
        noteFramesToTime: mod.noteFramesToTime,
        instance: new mod.BasicPitch(BASIC_PITCH_MODEL_URL),
      }));
      // Don't cache a failed load (offline, CDN hiccup) - let the next attempt retry instead
      // of every later hum/upload failing forever because of one dropped connection.
      p.catch(() => { basicPitchPromise = null; });
      basicPitchPromise = p;
      return p;
    }

    // Basic Pitch requires exactly-22.05kHz mono; this renders any decoded recording down
    // to that via an OfflineAudioContext, which does the resampling and channel downmix for
    // free as part of routing the buffer through it.
    async function resampleMono(audioBuffer) {
      const sampleCount = Math.ceil(audioBuffer.duration * TRANSCRIBE_SAMPLE_RATE);
      const offline = new OfflineAudioContext(1, sampleCount, TRANSCRIBE_SAMPLE_RATE);
      const src = offline.createBufferSource();
      src.buffer = audioBuffer;
      src.connect(offline.destination);
      src.start(0);
      return offline.startRendering();
    }

    // Runs the model over a decoded recording and returns its raw notes: any pitch, any
    // octave, exactly as heard. Fitting them onto eight bars is the reduction engine's job,
    // not this one - see reduceToXylophone below.
    async function transcribeAudioBuffer(audioBuffer, onProgress) {
      const { outputToNotesPoly, noteFramesToTime, instance } = await loadBasicPitch();
      const resampled = await resampleMono(audioBuffer);
      const frames = [], onsets = [], contours = [];
      await instance.evaluateModel(resampled, (f, o, c) => {
        frames.push(...f); onsets.push(...o); contours.push(...c);
      }, onProgress || (() => { }));
      return noteFramesToTime(outputToNotesPoly(frames, onsets))
        .map(n => ({ midi: n.pitchMidi, start: n.startTimeSeconds, dur: n.durationSeconds, amp: n.amplitude }));
    }

    // ---------- The reduction engine: any pitch, any octave -> eight fitted bars ----------
    // The step after a hum's raw transcribed notes: pad-ready {i, t} pairs out. Arrangement,
    // not capture - the goal is a tune a four-year-old recognises on an 8-bar diatonic toy,
    // not a verbatim transcript.
    const midiFromFreq = (freq) => Math.round(69 + 12 * Math.log2(freq / 440));
    const SCALE_MIDI = NOTES.map(n => midiFromFreq(n.freq)); // the bars' own pitches, e.g. C5-C6
    const MAJOR_SCALE_DEGREES = new Set([0, 2, 4, 5, 7, 9, 11]); // semitone offsets from a major tonic

    // Several transcribed notes can overlap (chords, transcription noise); an 8-bar
    // xylophone can't play them at once anyway, so keep only the highest-pitched note
    // active at each moment. This "skyline" reduction is the standard, simple way to pull a
    // monophonic lead melody out of polyphonic input.
    function skylineMelody(notes) {
      if (notes.length === 0) return [];
      const bounds = new Set();
      notes.forEach(n => { bounds.add(n.start); bounds.add(n.start + n.dur); });
      const ts = Array.from(bounds).sort((a, b) => a - b);
      const segments = [];
      for (let k = 0; k < ts.length - 1; k++) {
        const t0 = ts[k], t1 = ts[k + 1];
        let top = null;
        for (const n of notes) {
          if (n.start <= t0 && n.start + n.dur >= t1 && (!top || n.midi > top.midi)) top = n;
        }
        if (!top) continue;
        const last = segments[segments.length - 1];
        if (last && last.note === top && last.end === t0) last.end = t1;
        else segments.push({ note: top, start: t0, end: t1 });
      }
      return segments.map(s => ({ midi: s.note.midi, start: s.start, dur: s.end - s.start, amp: s.note.amp }));
    }

    // Weighted pitch-class histogram (longer, louder notes count more), correlated against
    // every possible major-scale tonic. The toy is a fixed major scale, so this only has to
    // ask "which of the 12 tonics fits this melody best," not distinguish major from minor.
    function detectTonicPitchClass(melody) {
      const weight = new Array(12).fill(0);
      melody.forEach(n => { weight[((n.midi % 12) + 12) % 12] += n.dur * (n.amp ?? 1); });
      let best = 0, bestScore = -Infinity;
      for (let tonic = 0; tonic < 12; tonic++) {
        let score = 0;
        for (let pc = 0; pc < 12; pc++) {
          if (MAJOR_SCALE_DEGREES.has(((pc - tonic) + 12) % 12)) score += weight[pc];
        }
        if (score > bestScore) { bestScore = score; best = tonic; }
      }
      return best;
    }

    // Among a few whole-octave placements of the (already key-shifted) melody, pick the one
    // that lands the most note-time inside the bars' actual register - "the transposition
    // that keeps the most notes in range."
    function chooseOctaveShift(melody, keyShift) {
      const candidates = [-24, -12, 0, 12, 24];
      let best = 0, bestScore = -Infinity;
      for (const oct of candidates) {
        let score = 0;
        melody.forEach(n => {
          const p = n.midi + keyShift + oct;
          if (p >= SCALE_MIDI[0] && p <= SCALE_MIDI[SCALE_MIDI.length - 1]) score += n.dur;
        });
        if (score > bestScore || (score === bestScore && Math.abs(oct) < Math.abs(best))) { bestScore = score; best = oct; }
      }
      return best;
    }

    // Notes still outside the register after the global shift (a melody spanning more than
    // an octave) get folded in whole octaves until they land inside it. The register spans a
    // full octave, so a given pitch class always has at least one (sometimes two, at its
    // edges) octave placement that lands inside - picking whichever of those is closest to
    // where the *previous* note landed, rather than each note's own nearest octave
    // regardless of range, keeps the melody's up/down shape intact instead of zig-zagging
    // every time it crosses a register boundary. Never landing outside the register also
    // matters downstream: snapToBars below matches by raw distance, and an out-of-range
    // pitch can sit closer to the wrong bar than to the right one.
    function foldToRegister(melody, baseShift) {
      const lo = SCALE_MIDI[0], hi = SCALE_MIDI[SCALE_MIDI.length - 1];
      let reference = (lo + hi) / 2;
      return melody.map(n => {
        const shifted = n.midi + baseShift;
        let best = null, bestDist = Infinity;
        for (let k = -8; k <= 8; k++) {
          const candidate = shifted + 12 * k;
          if (candidate < lo || candidate > hi) continue;
          const dist = Math.abs(candidate - reference);
          if (dist < bestDist) { bestDist = dist; best = candidate; }
        }
        reference = best;
        return { ...n, midi: best };
      });
    }

    // Last step: snap whatever's left (chromatic passing tones, notes the key detector
    // didn't fully explain) to the nearest bar, and keep an honest tally of how far that
    // snapping actually moved things.
    function snapToBars(melody) {
      let offWeight = 0, totalWeight = 0, offCount = 0;
      const notes = melody.map(n => {
        let bestIdx = 0, bestDist = Infinity;
        SCALE_MIDI.forEach((bar, i) => {
          const d = Math.abs(bar - n.midi);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        });
        totalWeight += n.dur;
        if (bestDist > 0) { offCount++; offWeight += n.dur; }
        return { i: bestIdx, t: n.start };
      });
      return { notes, fit: { total: notes.length, matched: notes.length - offCount, offRatio: totalWeight > 0 ? offWeight / totalWeight : 0 } };
    }

    function reduceToXylophone(rawNotes) {
      const melody = skylineMelody(rawNotes.filter(n => n.dur > 0));
      if (melody.length === 0) return { detected: [], fit: null };
      const tonic = detectTonicPitchClass(melody);
      const keyShift = ((0 - tonic) + 12) % 12; // moves the detected tonic onto the bars' own key
      const octaveShift = chooseOctaveShift(melody, keyShift);
      const folded = foldToRegister(melody, keyShift + octaveShift);
      const { notes, fit } = snapToBars(folded);
      return { detected: notes, fit };
    }

    // Turns a fit report into the honest sentence the roadmap asks for: silence on a perfect
    // fit, otherwise how much of the tune needed nudging and how badly.
    function fitMessage(fit) {
      if (!fit || fit.matched === fit.total) return null;
      const offCount = fit.total - fit.matched;
      const severe = fit.offRatio > 0.25;
      const lead = severe
        ? "This tune needs notes your xylophone doesn't have — here's the closest version."
        : 'Almost a perfect fit.';
      return `${lead} ${offCount} of ${fit.total} note${offCount === 1 ? '' : 's'} nudged to the nearest bar.`;
    }

    const BTN = "font-semibold text-[13px] border border-[#3a3d42] rounded-lg px-[13px] py-[7px] cursor-pointer text-[#e8eaed] bg-[#35383d] hover:bg-[#3f434a] active:translate-y-px disabled:opacity-45 disabled:cursor-not-allowed transition-colors";
    // The leading "!" forces these to beat BTN's own bg-[#35383d] in the cascade - Tailwind's CDN
    // JIT orders generated utility rules by its own internal sort, not by class-attribute order or
    // definition order, so without it some overrides silently lose to BTN's base color at random.
    const BTN_PRIMARY = "!bg-[#12897e] border-transparent hover:!bg-[#0f9c8f]";
    const BTN_AMBER = "!bg-[#b9691c] border-transparent hover:!bg-[#cf7a24]";
    const BTN_BLUE = "!bg-[#189ad3] border-transparent hover:!bg-[#2badea]";
    const BTN_PURPLE = "!bg-[#6a3fae] border-transparent hover:!bg-[#7d4fc7]";
    const BTN_DANGER = "!bg-[#a83a32] border-transparent hover:!bg-[#c2443a]";
    const BTN_ICON_DANGER = "font-semibold text-[12px] border border-transparent rounded-lg px-2 py-1 cursor-pointer text-white bg-[#a83a32] hover:bg-[#c2443a] active:translate-y-px disabled:opacity-45 disabled:cursor-not-allowed transition-colors shadow-[0_2px_6px_rgba(0,0,0,.35)]";
    const KBD = "font-bold text-[11px] bg-[#43474d] border border-[#52565d] rounded px-1.5 py-0.5 text-[#e8eaed]";
    const cx = (...xs) => xs.filter(Boolean).join(' ');

    // Lyrics is a 5-state cycle: off (nothing shown) -> on (classic single flowing line) ->
    // grouped (adds words positioned under their notes) -> link (grouped view + arm/drag to
    // create links) -> edit (raw text editing) -> back to off.
    const LYRIC_CYCLE = ['off', 'on', 'grouped', 'link', 'edit'];
    const noteEditable = (m) => m === 'off' || m === 'on' || m === 'grouped';
    const showGrouped = (m) => m === 'grouped' || m === 'link';

    // ---------- Help dialog content: keyboard shortcuts and usage tips ----------
    const SHORTCUTS = [
      { seq: [{ k: '1' }, { t: '–' }, { k: '8' }], desc: 'Write a note' },
      { seq: [{ k: 'Enter' }], desc: 'Start a new line' },
      { seq: [{ k: '←' }, { k: '→' }, { k: '↑' }, { k: '↓' }], desc: 'Move the cursor (or click)' },
      { seq: [{ k: '⌫' }], desc: 'Delete a dot, or the note once its dots run out' },
      { seq: [{ k: '⇧' }, { k: 'Del' }], desc: 'Delete a note and all its dots' },
      { seq: [{ k: 'Space' }, { t: '/' }, { k: '.' }], desc: 'Add a dot (extend the gap)' },
      { seq: [{ k: 'Esc' }], desc: 'Drop an armed lyric selection' },
    ];
    const TIPS = [
      'The dots after a note are the gap before the next one. Hover over them to see the exact time.',
      'Click past the dots to add one; click a dot to cut the gap back to that point.',
      'Play notes one after another at the end of the pad and your real timing is captured automatically; pause more than a beat and a new line starts on its own.',
      'Turn on 📝 Lyrics to type or edit the words below a line, then click a note (click more to grow the group) and drag-select the matching word(s) to link them – the linked word lights up when its note plays.',
      'Click a linked word to unlink it.',
      '🎯 Practice lights the next bar to strike – hit the right one to move on. A clean run through the whole song speeds up the next one.',
      '☁️ Connect Drive to sync your songs to Google Drive and pick them up on another device – needs the app hosted at a real URL (not opened as a local file).',
    ];

    function Bar({ note, index, target, barRef, onStrike }) {
      return html`
        <div class="flex flex-col items-center gap-3">
          <div
            ref=${barRef}
            class=${cx("bar w-[clamp(38px,5.6vw,54px)] rounded-[10px] cursor-pointer flex items-center justify-center [font-family:Georgia,'Times_New_Roman',serif] font-bold text-[26px] text-[#17181a] shadow-[0_3px_8px_rgba(0,0,0,.4)] transition-[filter,transform] duration-75 select-none [-webkit-tap-highlight-color:transparent] [touch-action:manipulation] hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-white focus-visible:outline-offset-[3px]",
        target && "target")}
            style=${{ '--bar-color': note.color, backgroundColor: note.color, height: (310 - index * 16) + 'px' }}
            role="button"
            tabindex="0"
            aria-label=${target ? `Bar ${index + 1}, note ${note.label || note.name}, practice target — tap this one` : `Bar ${index + 1}, note ${note.label || note.name}`}
            onPointerDown=${(e) => { e.preventDefault(); onStrike(index); }}
            onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onStrike(index); } }}
          >${note.label || note.name}</div>
          <div class="text-base text-[#cfd2d6] font-semibold">${index + 1}</div>
        </div>`;
    }

    function Xylophone({ barRefs, targetIndex, onStrike }) {
      return html`
        <div class="flex justify-center items-center gap-[clamp(6px,1.3vw,13px)]">
          ${NOTES.map((n, i) => html`<${Bar} key=${i} note=${n} index=${i} target=${i === targetIndex} onStrike=${onStrike}
            barRef=${(el) => { barRefs.current[i] = el; }} />`)}
        </div>`;
    }

    function SoundToggle({ soundType, onChange }) {
      const opt = (id, label) => html`
        <button type="button" key=${id}
          class=${cx("font-semibold text-[13px] border-0 px-3 py-[7px] cursor-pointer transition-colors",
        id !== 'wood' && "border-r border-[#3a3d42]",
        soundType === id ? "bg-[#12897e] text-white" : "text-[#9aa0a6] bg-[#35383d] hover:bg-[#3f434a]")}
          onClick=${() => onChange(id)}>${label}</button>`;
      return html`
        <div class="flex border border-[#3a3d42] rounded-lg overflow-hidden" role="group" aria-label="Bar material">
          ${opt('metal', '🔔 Metal')}${opt('wood', '🪵 Wood')}
        </div>`;
    }

    // The gap after a note/rest, shown as clickable dots (one dot = REST_UNIT_SEC).
    // Click past the dots to grow the gap; click a dot to cut it back to that point.
    function GapDots({ n, li, ni, lyricMode, onSetSec, onGrow, onTip, onHideTip }) {
      const count = Math.max(1, Math.round(n.sec / REST_UNIT_SEC));
      const dots = [];
      for (let d = 0; d < count; d++) dots.push(d);
      return html`
        <span class="inline-flex items-center text-[#6f7479] text-[15px] font-bold tracking-[1px] cursor-pointer pr-2 pl-0.5 py-0.5 rounded-md hover:bg-[#35383d] hover:text-[#9aa0a6]"
          data-pos=${n.rest ? (li + '-' + ni) : undefined}
          data-gap=${li + '-' + ni}
          onPointerMove=${(e) => {
          const dot = e.target.closest('[data-step]');
          const steps = dot ? +dot.dataset.step : count + 1;
          const cur = count * REST_UNIT_SEC;
          const delta = steps * REST_UNIT_SEC - cur;
          const text = delta === 0 ? cur.toFixed(1) + 's'
            : cur.toFixed(1) + (delta > 0 ? '+' : '-') + Math.abs(delta).toFixed(1) + 's';
          onTip(e.clientX, e.currentTarget.getBoundingClientRect().top, text);
        }}
          onPointerLeave=${onHideTip}
          onPointerDown=${(e) => {
          if (e.target !== e.currentTarget) return;
          e.stopPropagation();
          if (!noteEditable(lyricMode)) return;
          onGrow();
        }}
        >${dots.map(d => html`
          <span key=${d} data-step=${d + 1}
            onPointerDown=${(e) => { e.stopPropagation(); if (!noteEditable(lyricMode)) return; onSetSec((d + 1) * REST_UNIT_SEC); }}
          >·</span>`)}</span>`;
    }

    // One note chip: cursor placement when notes are editable, lyric-range arming in link mode.
    function Chip({ n, li, ni, linked, lyricMode, selected, playing, onArm, onPlace }) {
      return html`
        <div
          class=${cx("chip w-6 h-6 rounded-md flex items-center justify-center text-[12.5px] font-bold text-white [text-shadow:0_1px_2px_rgba(0,0,0,.35)] flex-none cursor-pointer",
        linked && "lyric-linked", selected && "lyric-selecting", playing && "playing")}
          style=${{ background: NOTES[n.i].color }}
          data-pos=${li + '-' + ni}
          onPointerDown=${(e) => {
          e.stopPropagation();
          if (lyricMode === 'link') onArm(li, ni);
          else if (noteEditable(lyricMode)) onPlace(li, ni);
        }}
        >${n.i + 1}</div>`;
    }

    // Flat character offset of (node, offset) within root's text, for turning a DOM Range
    // (which addresses a specific text node) into a plain index into line.lyric.
    function textOffset(root, node, offset) {
      let total = 0;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let cur;
      while ((cur = walker.nextNode())) {
        if (cur === node) return total + offset;
        total += cur.textContent.length;
      }
      return total;
    }

    // The caption always shows the FULL line text, unabridged - linking a word to a note
    // additionally mirrors it positioned under that note in PadLine, but never removes it from
    // here. Its own look depends on the current lyric-mode state:
    //  - off: not rendered at all
    //  - on: classic single line, linked words shown bold+underlined; click one to unlink it
    //  - grouped/link: same full line, but plain - the positioned labels under each note (shown
    //    in these two modes) are the "linked" indicator now, so this line doesn't duplicate it.
    //    In link mode only, drag-select a word here to link it to the armed note.
    //  - edit: plain contentEditable text (no tag spans - typing next to React-owned tag markup
    //    is what caused the old duplication/corruption bug)
    function LyricCaption({ line, li, tags, lyricMode, lyricSel, playingTagKey, onLinkSelection, onUnlink, onCaptionDone }) {
      const wrapRef = useRef(null);
      const text = line.lyric || '';
      const armed = !!(lyricMode === 'link' && lyricSel && lyricSel.line === li);
      const editing = lyricMode === 'edit';
      const classic = lyricMode === 'on';
      const interactive = lyricMode === 'link' || lyricMode === 'edit';

      // "grouped" is pure viewing: the positioned labels under each note already are the one
      // line of lyrics, horizontally laid out - showing this flowing line too would just repeat
      // it a second time. "link" still needs it, since dragging across it is how you pick a new
      // word to link.
      if (lyricMode === 'off' || lyricMode === 'grouped') return null;

      const handleMouseUp = () => {
        const wrap = wrapRef.current;
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        if (!wrap.contains(range.commonAncestorContainer)) return;
        if (sel.isCollapsed) {
          if (!classic) return; // no per-word tag spans to click here in grouped/link display
          const container = range.startContainer;
          const el = container.nodeType === 3 ? container.parentElement : container;
          const tagSpan = el && el.closest && el.closest('.lyric-tagged');
          if (tagSpan) onUnlink(li, +tagSpan.dataset.tagNote);
          return;
        }
        // a plain drag-selection (not armed) is left alone so copying the lyric text works normally -
        // this used to always clear the selection here, which is why copy appeared to silently fail
        if (!armed) return;
        const a = textOffset(wrap, range.startContainer, range.startOffset);
        const b = textOffset(wrap, range.endContainer, range.endOffset);
        const charStart = Math.min(a, b), charEnd = Math.max(a, b);
        if (charEnd <= charStart) return;
        sel.removeAllRanges();
        onLinkSelection(li, charStart, charEnd);
      };
      const handleInput = () => {
        // free-typed edits can't be safely re-mapped onto the old offsets, so they void
        // this line's links rather than risk a link silently pointing at the wrong word
        line.lyric = wrapRef.current.textContent;
        stripLyricTags(line.notes);
      };

      let children;
      if (editing) {
        children = text;
      } else if (!classic) {
        children = text; // grouped/link: plain, undecorated - the positioned label carries the "linked" cue
      } else {
        const parts = [];
        let pos = 0;
        tags.forEach(t => {
          if (t.start > pos) parts.push(text.slice(pos, t.start));
          const key = li + '-' + t.noteIdx;
          parts.push(html`
            <span key=${key} class=${cx("lyric-tagged font-bold not-italic", playingTagKey === key && "playing")}
              data-tag-note=${t.noteIdx}>${text.slice(t.start, t.end)}</span>`);
          pos = t.end;
        });
        if (pos < text.length) parts.push(text.slice(pos));
        children = parts;
      }

      return html`
        <div ref=${wrapRef}
          class=${cx("lyric text-[14px] text-[#84898e] italic",
        lyricMode === 'link' ? "mt-2.5" : "mt-[3px]",
        interactive && "lyric-editable not-italic outline outline-offset-[3px] rounded min-h-[14px]",
        editing && "outline-1 outline-dashed outline-[#b9691c] cursor-text",
        lyricMode === 'link' && (armed
          ? "outline-2 outline-[#12897e] bg-[rgba(18,137,126,.14)] cursor-pointer"
          : "outline-1 outline-dashed outline-[#3a3d42] cursor-default"))}
          contentEditable=${editing}
          suppressContentEditableWarning=${true}
          onPointerDown=${interactive ? (e) => e.stopPropagation() : undefined}
          onMouseUp=${(classic || lyricMode === 'link') ? handleMouseUp : undefined}
          onInput=${editing ? handleInput : undefined}
          onBlur=${editing ? onCaptionDone : undefined}
        >${children}</div>`;
    }

    // Notes are grouped into "units" of one note (untagged) or a whole tagged span (2+ notes
    // that share one lyric word/phrase). Each unit is a single flex-col item - chip(s)+dots on
    // top, the linked word centered below - so: (a) CSS alone centers whichever side is
    // narrower, no width math needed, and (b) a multi-note span can never be split across a
    // line-wrap, since it's one atomic flex item.
    function PadLine({ line, li, cursor, lyricMode, lyricSel, playingPos, playingTagKey, empty,
      onArmNote, onPlaceCursor, onSetGapSec, onGrowGap, onTip, onHideTip,
      onLinkSelection, onUnlink, onCaptionDone, onRowClick }) {
      const tags = collectLineTags(line);
      const tagByNoteIdx = new Map(tags.map(t => [t.noteIdx, t]));
      const text = line.lyric || '';
      const units = [];
      let ni = 0;
      while (ni < line.notes.length) {
        const unitStart = ni;
        const tag = tagByNoteIdx.get(ni);
        const span = tag ? tag.noteSpan : 1;
        const subItems = [];
        for (let k = 0; k < span; k++) {
          const idx = ni + k;
          const n = line.notes[idx];
          if (li === cursor.line && idx === cursor.pos && noteEditable(lyricMode)) subItems.push(html`<span key=${'caret-' + idx} class=${cx("caret", cursor.pos > 0 && "caret-tight")}></span>`);
          if (!n.rest) {
            const selected = !!(lyricMode === 'link' && lyricSel && lyricSel.line === li && idx >= lyricSel.start && idx <= lyricSel.end);
            const playing = !!(playingPos && playingPos.li === li && playingPos.ni === idx);
            subItems.push(html`<${Chip} key=${'chip-' + idx} n=${n} li=${li} ni=${idx} linked=${!!tag} lyricMode=${lyricMode}
              selected=${selected} playing=${playing} onArm=${onArmNote} onPlace=${onPlaceCursor} />`);
          }
          subItems.push(html`<${GapDots} key=${'gap-' + idx} n=${n} li=${li} ni=${idx} lyricMode=${lyricMode}
            onSetSec=${(sec) => onSetGapSec(li, idx, sec)} onGrow=${() => onGrowGap(li, idx)}
            onTip=${onTip} onHideTip=${onHideTip} />`);
        }
        const tagKey = tag ? li + '-' + tag.noteIdx : null;
        units.push(html`
          <span key=${'unit-' + unitStart} class="inline-flex flex-col items-start">
            <span class="inline-flex gap-[5px]">${subItems}</span>
            ${tag && showGrouped(lyricMode) ? html`
              <span class=${cx("text-[11px] font-bold not-italic whitespace-nowrap mt-0.5 text-[#84898e] rounded px-1",
          lyricMode === 'link' && "cursor-pointer",
          playingTagKey === tagKey && "playing !bg-[#12897e] !text-white")}
                data-tag-note=${tag.noteIdx}
                onPointerDown=${lyricMode === 'link' ? (e) => { e.stopPropagation(); onUnlink(li, tag.noteIdx); } : undefined}
              >${text.slice(tag.start, tag.end)}</span>` : null}
          </span>`);
        ni += span;
      }
      if (li === cursor.line && cursor.pos >= line.notes.length && noteEditable(lyricMode)) units.push(html`<span key="caret-end" class=${cx("caret", cursor.pos > 0 && "caret-tight")}></span>`);
      if (empty) units.push(html`<span key="ph" class="text-[#6f7479] text-[12.5px] italic">Tap the bars to write your tune…</span>`);

      return html`
        <div class="py-[5px] border-b border-[#33363b] last:border-b-0"
          onPointerDown=${(e) => onRowClick(li, e)}>
          <div class=${cx("flex flex-wrap items-start gap-[5px] min-h-[26px]", noteEditable(lyricMode) ? "cursor-text" : "cursor-default")}>${units}</div>
          <${LyricCaption} line=${line} li=${li} tags=${tags} lyricMode=${lyricMode} lyricSel=${lyricSel} playingTagKey=${playingTagKey}
            onLinkSelection=${onLinkSelection} onUnlink=${onUnlink} onCaptionDone=${onCaptionDone} />
        </div>`;
    }

    function GapTooltip({ tip }) {
      if (!tip) return null;
      return ReactDOM.createPortal(
        html`<div class="fixed [transform:translate(-50%,calc(-100%-8px))] bg-[#111214] text-[#e8eaed] font-semibold text-[11px] px-1.5 py-0.5 rounded border border-[#3a3d42] pointer-events-none whitespace-nowrap z-50"
          style=${{ left: tip.x + 'px', top: tip.y + 'px' }}>${tip.text}</div>`,
        document.body);
    }

    function HelpDialog({ dialogRef }) {
      return html`
        <dialog ref=${dialogRef}
          class="bg-[#2a2d31] text-[#e8eaed] border border-[#3a3d42] rounded-[12px] p-0 max-w-[520px] w-[92vw] shadow-[0_20px_50px_rgba(0,0,0,.5)] [&::backdrop]:bg-black/60"
          onClick=${(e) => { if (e.target === e.currentTarget) e.currentTarget.close(); }}>
          <div class="p-5">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-[16px] font-bold m-0">Help & shortcuts</h2>
              <button type="button" aria-label="Close"
                class="text-[#9aa0a6] hover:text-[#e8eaed] text-[22px] leading-none border-0 bg-transparent cursor-pointer p-0"
                onClick=${(e) => e.currentTarget.closest('dialog').close()}>×</button>
            </div>

            <h3 class="text-[11.5px] uppercase tracking-wide text-[#84898e] font-bold mb-2 mt-0">Keyboard shortcuts</h3>
            <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2 text-[13px] m-0 mb-5">
              ${SHORTCUTS.map((row, ri) => html`
                <dt key=${'k' + ri} class="flex gap-1 items-center flex-wrap m-0">
                  ${row.seq.map((tok, ti) => tok.k
        ? html`<kbd key=${ti} class=${KBD}>${tok.k}</kbd>`
        : html`<span key=${ti} class="text-[#6f7479] px-0.5">${tok.t}</span>`)}
                </dt>
                <dd key=${'d' + ri} class="m-0 text-[#cfd2d6] self-center">${row.desc}</dd>`)}
            </dl>

            <h3 class="text-[11.5px] uppercase tracking-wide text-[#84898e] font-bold mb-2">Tips</h3>
            <ul class="list-disc m-0 pl-[18px] text-[13px] text-[#cfd2d6] leading-[1.6] flex flex-col gap-2">
              ${TIPS.map((tip, ti) => html`<li key=${ti}>${tip}</li>`)}
            </ul>
          </div>
        </dialog>`;
    }

    // Replaces window.prompt/confirm/alert with an in-theme <dialog>. Only mounted while a
    // modal is queued (rather than kept in the DOM and toggled via open/close like
    // HelpDialog) so a second <dialog> element never lingers for tests/queries to trip over
    // once it's dismissed. type is 'prompt' (text input), 'confirm' (Cancel + action), or
    // 'alert' (message + OK only); onSubmit/onCancel resolve the caller's pending promise.
    function ActionDialog({ modal, onSubmit, onCancel }) {
      const dialogRef = useRef(null);
      const inputRef = useRef(null);
      useEffect(() => { if (modal && dialogRef.current && !dialogRef.current.open) dialogRef.current.showModal(); }, [modal]);
      if (!modal) return null;
      const isPrompt = modal.type === 'prompt';
      const isAlert = modal.type === 'alert';
      const toneStyle = modal.tone === 'danger' ? BTN_DANGER : modal.tone === 'amber' ? BTN_AMBER : BTN_PRIMARY;
      return html`
        <dialog ref=${dialogRef}
          class="bg-[#2a2d31] text-[#e8eaed] border border-[#3a3d42] rounded-[12px] p-0 max-w-[420px] w-[92vw] shadow-[0_20px_50px_rgba(0,0,0,.5)] [&::backdrop]:bg-black/60"
          onCancel=${(e) => { e.preventDefault(); onCancel(); }}
          onClick=${(e) => { if (e.target === e.currentTarget) onCancel(); }}
        >
          <form class="p-5" onSubmit=${(e) => { e.preventDefault(); onSubmit(isPrompt ? inputRef.current.value : true); }}>
            <p class="text-[14px] leading-[1.5] whitespace-pre-line m-0 mb-3.5">${modal.message}</p>
            ${isPrompt ? html`
              <input ref=${inputRef} type="text" defaultValue=${modal.defaultValue || ''} autoFocus=${true}
                class="w-full font-semibold text-[14px] px-3 py-2 rounded-lg border border-[#3a3d42] bg-[#35383d] text-[#e8eaed] outline-none focus:border-[#12897e] mb-4" />` : null}
            <div class="flex justify-end gap-2">
              ${!isAlert ? html`<button type="button" class=${BTN} onClick=${onCancel}>Cancel</button>` : null}
              <button type="submit" class=${cx(BTN, toneStyle)} autoFocus=${!isPrompt}>${modal.confirmLabel || 'OK'}</button>
            </div>
          </form>
        </dialog>`;
    }

    function App() {
      const [, bump] = useReducer(x => x + 1, 0);
      const forceUpdate = useCallback(() => bump(), []);

      const S = useRef(null);
      if (!S.current) {
        S.current = {
          lines: [{ notes: [], lyric: '' }],
          cursor: { line: 0, pos: 0 },
          lastLiveNote: null,
          player: { events: [], idx: 0, timer: null, playing: false },
          practice: { active: false, events: [], idx: 0, speed: 1, mistakes: 0 },
          playingPos: null,
          playingTagKey: null,
          gapFlashId: 0,
          gapFlashTimer: null,
          driveFileId: null,
        };
      }
      const s = S.current;

      const [soundType, setSoundTypeState] = useState(loadSoundPref());
      const soundTypeRef = useRef(soundType);
      const [bpm, setBpm] = useState(100);
      const bpmRef = useRef(100);
      const [savedSongs, setSavedSongs] = useState(loadSavedSongs());
      const [currentSongName, setCurrentSongName] = useState(null);
      const [tuneValue, setTuneValue] = useState('');
      const [driveStatus, setDriveStatus] = useState('disconnected'); // disconnected | connecting | syncing | connected | error
      const [lyricMode, setLyricMode] = useState('off'); // one of LYRIC_CYCLE
      const [lyricSel, setLyricSel] = useState(null);
      const [micRunning, setMicRunning] = useState(false);
      const [tip, setTip] = useState(null);
      const [linkHint, setLinkHint] = useState(null);
      const [modal, setModal] = useState(null);

      // ---------- prompt()/confirm()/alert() replacements, resolved by <${ActionDialog}> ----------
      function askPrompt(message, defaultValue) {
        return new Promise(resolve => setModal({ type: 'prompt', message, defaultValue, resolve }));
      }
      function askConfirm(message, opts = {}) {
        return new Promise(resolve => setModal({ type: 'confirm', message, confirmLabel: opts.confirmLabel, tone: opts.tone, resolve }));
      }
      function showAlert(message) {
        return new Promise(resolve => setModal({ type: 'alert', message, resolve }));
      }
      function submitModal(value) { setModal(m => { m.resolve(value); return null; }); }
      function cancelModal() { setModal(m => { m.resolve(m.type === 'prompt' ? null : false); return null; }); }

      const barRefs = useRef([]);
      const padRef = useRef(null);
      const dialogRef = useRef(null);

      // Armed-note hint: a fixed-position tooltip (never part of document flow, so it can
      // never push pad rows around) anchored over the most recently armed chip.
      useEffect(() => {
        if (!lyricSel || !padRef.current) { setLinkHint(null); return; }
        const reposition = () => {
          const el = padRef.current.querySelector(`[data-pos="${lyricSel.line}-${lyricSel.end}"]`);
          if (!el) { setLinkHint(null); return; }
          const r = el.getBoundingClientRect();
          setLinkHint({ x: r.left + r.width / 2, y: r.top, text: 'Select a word to link it · Esc to cancel' });
        };
        reposition();
        const pad = padRef.current;
        pad.addEventListener('scroll', reposition);
        window.addEventListener('resize', reposition);
        return () => { pad.removeEventListener('scroll', reposition); window.removeEventListener('resize', reposition); };
      }, [lyricSel]);

      useEffect(() => { document.body.dataset.material = soundType; }, [soundType]);

      // Test-only: the pad never displays a note's raw sec (dots always show the rounded
      // value), so timing-precision bugs like off-grid drift from repeated dot edits are
      // invisible to a DOM assertion. getSec/pokeSec let Playwright inspect and set the raw
      // value directly. Merges onto window.__xyloTest rather than assigning, since the
      // reduction-engine hook below is installed separately and either can run first.
      useEffect(() => {
        window.__xyloTest = window.__xyloTest || {};
        window.__xyloTest.getSec = (li, ni) => s.lines[li].notes[ni].sec;
        window.__xyloTest.pokeSec = (li, ni, sec) => { s.lines[li].notes[ni].sec = sec; forceUpdate(); };
      }, []);

      // ---------- pad mutation helpers (mutate the ref, then re-render) ----------
      function scrollAfterRender(target) { s.scrollTarget = target; forceUpdate(); }

      function strike(i) {
        playNote(i, soundTypeRef.current, barRefs.current);
        finishPlayback();
        const now = performance.now();
        const atEnd = s.cursor.line === s.lines.length - 1 && s.cursor.pos === s.lines[s.cursor.line].notes.length;
        const continuesLive = atEnd && s.lastLiveNote && s.lastLiveNote.note === s.lines[s.cursor.line].notes[s.cursor.pos - 1];
        if (continuesLive) {
          const gapSec = (now - s.lastLiveNote.time) / 1000;
          s.lastLiveNote.note.sec = clamp(gapSec, MIN_LIVE_GAP_SEC, MAX_PAUSE_SEC);
          if (gapSec > PHRASE_BREAK_SEC) {
            s.lines.push({ notes: [], lyric: '' });
            s.cursor = { line: s.lines.length - 1, pos: 0 };
          }
        }
        const note = { i, sec: QUARTER_SEC };
        invalidateTagsAt(s.lines[s.cursor.line], s.cursor.pos);
        s.lines[s.cursor.line].notes.splice(s.cursor.pos, 0, note);
        s.cursor.pos++;
        s.lastLiveNote = atEnd ? { note, time: now } : null;
        scrollAfterRender({ type: 'caret' });
      }
      function newLine() {
        finishPlayback();
        s.lastLiveNote = null;
        invalidateTagsAt(s.lines[s.cursor.line], s.cursor.pos);
        const tail = s.lines[s.cursor.line].notes.splice(s.cursor.pos);
        stripLyricTags(tail);
        s.lines.splice(s.cursor.line + 1, 0, { notes: tail, lyric: '' });
        s.cursor = { line: s.cursor.line + 1, pos: 0 };
        scrollAfterRender({ type: 'caret' });
      }
      function backspace() {
        finishPlayback();
        s.lastLiveNote = null;
        const line = s.lines[s.cursor.line];
        let flashGap = null;
        if (s.cursor.pos > 0) {
          const n = line.notes[s.cursor.pos - 1];
          if (dotCount(n) > 1) {
            n.sec = (dotCount(n) - 1) * REST_UNIT_SEC;
            flashGap = { li: s.cursor.line, ni: s.cursor.pos - 1, sec: n.sec };
          } else {
            invalidateTagsAt(line, s.cursor.pos - 1);
            line.notes.splice(s.cursor.pos - 1, 1);
            s.cursor.pos--;
          }
        } else if (s.cursor.line > 0) {
          const prev = s.lines[s.cursor.line - 1];
          s.cursor = { line: s.cursor.line - 1, pos: prev.notes.length };
          stripLyricTags(line.notes);
          prev.notes = prev.notes.concat(line.notes);
          s.lines.splice(s.cursor.line + 1, 1);
        }
        scrollAfterRender({ type: 'caret', flashGap });
      }
      function forwardDelete() {
        finishPlayback();
        s.lastLiveNote = null;
        const line = s.lines[s.cursor.line];
        if (s.cursor.pos < line.notes.length) {
          const n = line.notes[s.cursor.pos];
          if (dotCount(n) > 1) { n.sec = (dotCount(n) - 1) * REST_UNIT_SEC; }
          else { invalidateTagsAt(line, s.cursor.pos); line.notes.splice(s.cursor.pos, 1); }
        } else if (s.cursor.line < s.lines.length - 1) {
          stripLyricTags(s.lines[s.cursor.line + 1].notes);
          line.notes = line.notes.concat(s.lines[s.cursor.line + 1].notes);
          s.lines.splice(s.cursor.line + 1, 1);
        }
        scrollAfterRender({ type: 'caret' });
      }
      function hardDelete() {
        finishPlayback();
        s.lastLiveNote = null;
        const line = s.lines[s.cursor.line];
        if (s.cursor.pos < line.notes.length) {
          invalidateTagsAt(line, s.cursor.pos);
          line.notes.splice(s.cursor.pos, 1);
        } else if (s.cursor.line < s.lines.length - 1) {
          stripLyricTags(s.lines[s.cursor.line + 1].notes);
          line.notes = line.notes.concat(s.lines[s.cursor.line + 1].notes);
          s.lines.splice(s.cursor.line + 1, 1);
        }
        scrollAfterRender({ type: 'caret' });
      }
      function addDot() {
        if (s.cursor.pos === 0) return;
        finishPlayback();
        s.lastLiveNote = null;
        const li = s.cursor.line, ni = s.cursor.pos - 1;
        const n = s.lines[li].notes[ni];
        n.sec = (dotCount(n) + 1) * REST_UNIT_SEC;
        scrollAfterRender({ type: 'caret', flashGap: { li, ni, sec: n.sec } });
      }
      function moveCursor(key) {
        const len = () => s.lines[s.cursor.line].notes.length;
        if (key === 'ArrowLeft') {
          if (s.cursor.pos > 0) s.cursor.pos--;
          else if (s.cursor.line > 0) { s.cursor.line--; s.cursor.pos = len(); }
        } else if (key === 'ArrowRight') {
          if (s.cursor.pos < len()) s.cursor.pos++;
          else if (s.cursor.line < s.lines.length - 1) { s.cursor.line++; s.cursor.pos = 0; }
        } else if (key === 'ArrowUp') {
          if (s.cursor.line > 0) { s.cursor.line--; s.cursor.pos = Math.min(s.cursor.pos, len()); }
          else s.cursor.pos = 0;
        } else if (key === 'ArrowDown') {
          if (s.cursor.line < s.lines.length - 1) { s.cursor.line++; s.cursor.pos = Math.min(s.cursor.pos, len()); }
          else s.cursor.pos = len();
        } else if (key === 'Home') { s.cursor.pos = 0; }
        else if (key === 'End') { s.cursor.pos = len(); }
        scrollAfterRender({ type: 'caret' });
      }

      // ---------- lyric linking ----------
      function armNote(li, ni) {
        if (s.practice.active) return;
        setLyricSel(prev => {
          if (!prev || prev.line !== li) return { line: li, start: ni, end: ni };
          return { line: li, start: Math.min(prev.start, ni), end: Math.max(prev.end, ni) };
        });
      }
      function placeCursor(li, ni) {
        if (s.practice.active) return;
        s.cursor = { line: li, pos: ni + 1 };
        scrollAfterRender({ type: 'caret' });
      }
      function onLinkSelection(li, charStart, charEnd) {
        if (s.practice.active) return;
        setLyricSel(sel => {
          if (!sel || sel.line !== li) return sel;
          linkLyricSelection(s.lines[li], sel.start, sel.end, charStart, charEnd);
          forceUpdate();
          return null;
        });
      }
      function onUnlink(li, noteIdx) {
        if (s.practice.active) return;
        stripLyricTags([s.lines[li].notes[noteIdx]]);
        forceUpdate();
      }
      function onRowClick(li, e) {
        if (s.practice.active || !noteEditable(lyricMode)) { setLyricSel(null); return; }
        const line = s.lines[li];
        const allMarks = Array.from(e.currentTarget.querySelectorAll('[data-pos]'))
          .map(el => ({ ni: +el.dataset.pos.split('-')[1], rect: el.getBoundingClientRect() }))
          .sort((a, b) => a.ni - b.ni);
        // Notes wrap onto multiple visual rows on long lines; restrict to the row under the click
        // so an X-only comparison doesn't jump across wrapped rows.
        const sameRow = allMarks.filter(m => e.clientY >= m.rect.top && e.clientY <= m.rect.bottom);
        const marks = sameRow.length ? sameRow : allMarks;
        let pos = line.notes.length;
        for (const m of marks) {
          if (e.clientX < m.rect.left + m.rect.width / 2) { pos = m.ni; break; }
          pos = m.ni + 1;
        }
        s.cursor = { line: li, pos };
        scrollAfterRender({ type: 'caret' });
      }
      function cycleLyricMode() {
        setLyricMode(m => LYRIC_CYCLE[(LYRIC_CYCLE.indexOf(m) + 1) % LYRIC_CYCLE.length]);
        setLyricSel(null);
      }

      // ---------- playback ----------
      function buildEvents() {
        const evs = [];
        s.lines.forEach((line, li) => {
          line.notes.forEach((n, ni) => evs.push({ li, ni, rest: !!n.rest, i: n.i, sec: n.sec }));
        });
        return evs;
      }
      function clearPlayingHighlight() { s.playingPos = null; s.playingTagKey = null; }
      function step() {
        if (s.player.idx >= s.player.events.length) { finishPlayback(); return; }
        const ev = s.player.events[s.player.idx];
        const speed = bpmRef.current / 100;
        const durMs = ev.sec * 1000 / speed;
        if (!ev.rest) playNote(ev.i, soundTypeRef.current, barRefs.current, 0, durMs * 0.9);
        clearPlayingHighlight();
        s.playingPos = { li: ev.li, ni: ev.ni };
        const tag = collectLineTags(s.lines[ev.li]).find(t => ev.ni >= t.noteIdx && ev.ni <= t.noteIdx + t.noteSpan - 1);
        if (tag) s.playingTagKey = ev.li + '-' + tag.noteIdx;
        s.player.idx++;
        s.player.timer = setTimeout(step, durMs);
        scrollAfterRender({ type: 'pos', key: ev.li + '-' + ev.ni });
      }
      function startOrResume() {
        if (s.player.playing) return;
        if (s.player.idx === 0) s.player.events = buildEvents();
        if (s.player.events.length === 0) return;
        s.player.playing = true;
        step();
      }
      function pausePlayback() {
        clearTimeout(s.player.timer);
        s.player.playing = false;
        forceUpdate();
      }
      function finishPlayback() {
        clearTimeout(s.player.timer);
        s.player.playing = false;
        s.player.idx = 0;
        clearPlayingHighlight();
        forceUpdate();
      }

      // ---------- practice mode ----------
      // Rests have no bar to strike, so they're dropped up front rather than auto-skipped
      // one at a time - the child only ever waits on an actual note.
      function showPracticeTarget() {
        const ev = s.practice.events[s.practice.idx];
        clearPlayingHighlight();
        s.playingPos = { li: ev.li, ni: ev.ni };
        const tag = collectLineTags(s.lines[ev.li]).find(t => ev.ni >= t.noteIdx && ev.ni <= t.noteIdx + t.noteSpan - 1);
        if (tag) s.playingTagKey = ev.li + '-' + tag.noteIdx;
        scrollAfterRender({ type: 'pos', key: ev.li + '-' + ev.ni });
      }
      function startPractice() {
        finishPlayback();
        s.lastLiveNote = null;
        const events = buildEvents().filter(e => !e.rest);
        if (events.length === 0) return;
        s.practice = { active: true, events, idx: 0, speed: 1, mistakes: 0 };
        showPracticeTarget();
      }
      function stopPractice() {
        s.practice.active = false;
        clearPlayingHighlight();
        forceUpdate();
      }
      // A wrong bar just plays its own sound as feedback and doesn't advance - only the lit
      // bar moves the song on. A full pass with zero mistakes speeds the next one up; any
      // mistake holds the speed where it is rather than knocking it back down.
      function practiceStrike(i) {
        playNote(i, soundTypeRef.current, barRefs.current);
        const p = s.practice;
        const target = p.events[p.idx];
        if (i !== target.i) { p.mistakes++; forceUpdate(); return; }
        p.idx++;
        if (p.idx >= p.events.length) {
          if (p.mistakes === 0) p.speed = Math.min(2, Math.round((p.speed + 0.15) * 100) / 100);
          p.idx = 0;
          p.mistakes = 0;
        }
        showPracticeTarget();
      }

      // scroll effect: runs after each commit, once
      useEffect(() => {
        const target = s.scrollTarget;
        s.scrollTarget = null;
        if (!target || !padRef.current) return;
        if (target.type === 'caret') {
          const el = padRef.current.querySelector('.caret');
          if (el) el.scrollIntoView({ block: 'nearest' });
        } else if (target.type === 'pos') {
          const el = padRef.current.querySelector(`[data-pos="${target.key}"]`);
          if (el) el.scrollIntoView({ block: 'nearest' });
        }
        if (target.flashGap) {
          const { li, ni, sec } = target.flashGap;
          const el = padRef.current.querySelector(`[data-gap="${li}-${ni}"]`);
          if (el) {
            const r = el.getBoundingClientRect();
            clearTimeout(s.gapFlashTimer);
            const flashId = ++s.gapFlashId;
            setTip({ x: r.left + r.width / 2, y: r.top, text: sec.toFixed(1) + 's' });
            s.gapFlashTimer = setTimeout(() => { if (s.gapFlashId === flashId) setTip(null); }, 900);
          }
        }
      });

      // ---------- songs ----------
      function setCurrentSong(name) { setCurrentSongName(name); }
      function selectTuneOption(name) { setTuneValue(name || ''); }

      function doClear() {
        finishPlayback();
        s.lastLiveNote = null;
        s.lines = [{ notes: [], lyric: '' }];
        s.cursor = { line: 0, pos: 0 };
        setCurrentSong(null);
        selectTuneOption(null);
        scrollAfterRender({ type: 'caret' });
      }
      function onTuneChange(e) {
        const name = e.target.value;
        setTuneValue(name);
        if (!name) return;
        finishPlayback();
        s.lastLiveNote = null;
        s.lines = cloneLines(savedSongs[name].lines);
        setCurrentSong(name);
        s.cursor = { line: s.lines.length - 1, pos: s.lines[s.lines.length - 1].notes.length };
        scrollAfterRender({ type: 'caret' });
        e.target.blur();
      }
      async function saveSong() {
        if (!hasNotes(s.lines)) { await showAlert('Play or write some notes before saving a song.'); return; }
        const name = await askPrompt('Song name:', currentSongName || '');
        if (name === null) return;
        const trimmed = name.trim();
        if (!trimmed) return;
        if (savedSongs[trimmed] && trimmed !== currentSongName) {
          const ok = await askConfirm(`"${trimmed}" already exists. Overwrite it?`, { confirmLabel: 'Overwrite', tone: 'amber' });
          if (!ok) return;
        }
        const next = { ...savedSongs, [trimmed]: { lines: cloneLines(s.lines), updatedAt: Date.now() } };
        setSavedSongs(next);
        persistSavedSongs(next);
        const tombstones = loadTombstones();
        if (tombstones[trimmed]) { delete tombstones[trimmed]; persistTombstones(tombstones); }
        setCurrentSong(trimmed);
        selectTuneOption(trimmed);
        pushToDrive(next, tombstones);
      }
      async function deleteSong() {
        if (!currentSongName) return;
        const ok = await askConfirm(`Delete "${currentSongName}"?`, { confirmLabel: 'Delete', tone: 'danger' });
        if (!ok) return;
        const next = { ...savedSongs };
        delete next[currentSongName];
        setSavedSongs(next);
        persistSavedSongs(next);
        const tombstones = { ...loadTombstones(), [currentSongName]: Date.now() };
        persistTombstones(tombstones);
        setCurrentSong(null);
        selectTuneOption(null);
        finishPlayback();
        s.lastLiveNote = null;
        s.lines = [{ notes: [], lyric: '' }];
        s.cursor = { line: 0, pos: 0 };
        scrollAfterRender({ type: 'caret' });
        pushToDrive(next, tombstones);
      }

      // ---------- Google Drive sync ----------
      // A one-time (per browser) Client ID, pasted in by the user - see the connect
      // prompt below for the Google Cloud Console setup it refers to. Kept out of the
      // source so the same file works for anyone who hosts their own copy.
      async function connectDrive(opts = {}) {
        const silent = !!opts.silent;
        if (location.protocol === 'file:') {
          if (!silent) await showAlert("Google Drive sync needs this page served over http:// or https:// (not opened as a local file) - Google's sign-in won't run from a file:// URL. Host it (e.g. GitHub Pages) and open it from there.");
          return;
        }
        let clientId = loadDriveClientId();
        if (!clientId) {
          if (silent) return;
          const entered = await askPrompt(
            "Paste your Google OAuth Client ID to turn on Drive sync.\n\n" +
            "One-time setup in Google Cloud Console: create a project, enable the " +
            "Google Drive API, configure the OAuth consent screen (add yourself as a " +
            "test user), then create an OAuth Client ID of type 'Web application' with " +
            "this page's URL listed under Authorized JavaScript origins. Paste that " +
            "Client ID here.", '');
          if (!entered || !entered.trim()) return;
          clientId = entered.trim();
          saveDriveClientId(clientId);
        }
        setDriveStatus('connecting');
        try {
          await loadGoogleIdentity();
          initDriveTokenClient(clientId);
          await requestDriveToken(silent ? '' : 'consent');
          saveDriveConnected(true);
          await syncWithDrive();
          setDriveStatus('connected');
        } catch (err) {
          console.error(err);
          if (!silent) await showAlert("Couldn't connect to Google Drive: " + err.message);
          setDriveStatus('disconnected');
          saveDriveConnected(false);
        }
      }
      // Pulls the remote file (if any), merges it with local state by per-song timestamp,
      // then writes the merged result back to both localStorage and Drive - so connecting
      // on a second device both loads what's already synced and reconciles anything this
      // device saved offline.
      async function syncWithDrive() {
        setDriveStatus('syncing');
        const fileId = await findSyncFileId();
        const remote = fileId ? await downloadSyncFile(fileId) : null;
        const localTombstones = loadTombstones();
        const localSongs = {};
        Object.entries(savedSongs).forEach(([name, song]) => {
          localSongs[name] = song.updatedAt ? song : { ...song, updatedAt: Date.now() };
        });
        const merged = mergeSyncState(localSongs, localTombstones, remote);
        setSavedSongs(merged.songs);
        persistSavedSongs(merged.songs);
        persistTombstones(merged.tombstones);
        s.driveFileId = await uploadSyncFile(fileId, merged);
      }
      // Fire-and-forget upload after a local save/delete. Local storage is already the
      // source of truth by the time this runs, so a failure here just leaves Drive stale
      // until the next successful sync (on reconnect, or the next save) - it never risks
      // the change that was just made locally.
      async function pushToDrive(songs, tombstones) {
        if (!loadDriveConnected()) return;
        try {
          setDriveStatus('syncing');
          const fileId = s.driveFileId || await findSyncFileId();
          s.driveFileId = await uploadSyncFile(fileId, { songs, tombstones });
          setDriveStatus('connected');
        } catch (err) {
          console.error(err);
          setDriveStatus('error');
        }
      }
      async function onDriveButtonClick() {
        if (driveStatus === 'connected' || driveStatus === 'error') {
          const ok = await askConfirm('Disconnect Google Drive? Your songs stay saved on this device.', { confirmLabel: 'Disconnect', tone: 'amber' });
          if (!ok) return;
          saveDriveConnected(false);
          driveAccessToken = null;
          s.driveFileId = null;
          setDriveStatus('disconnected');
          return;
        }
        connectDrive();
      }
      // On load, silently re-request an access token (no popup) if this browser was
      // connected before - covers returning to the app in a fresh tab. If the browser no
      // longer has a live Google session, this just fails quietly and the button falls
      // back to its disconnected state for the user to reconnect by hand.
      useEffect(() => {
        if (location.protocol === 'file:' || !loadDriveConnected()) return;
        connectDrive({ silent: true });
      }, []);
      function loadDetected(detected) {
        finishPlayback();
        s.lastLiveNote = null;
        s.lines = [{ notes: [], lyric: '' }];
        setCurrentSong(null);
        selectTuneOption(null);
        detected.forEach((d, k) => {
          const next = detected[k + 1];
          const gap = next ? next.t - d.t : QUARTER_SEC;
          if (s.lines[s.lines.length - 1].notes.length >= 8) s.lines.push({ notes: [], lyric: '' });
          s.lines[s.lines.length - 1].notes.push({ i: d.i, sec: clamp(gap, MIN_LIVE_GAP_SEC, MAX_PAUSE_SEC) });
          if (next && gap > PHRASE_BREAK_SEC) s.lines.push({ notes: [], lyric: '' });
        });
        s.cursor = { line: s.lines.length - 1, pos: s.lines[s.lines.length - 1].notes.length };
        scrollAfterRender({ type: 'caret' });
      }

      // ---------- Getting songs in: hum it, then transcribe ----------
      // A hummed/sung recording is one clean voice with nothing else in it to confuse the
      // reduction engine's melody-picking - Basic Pitch transcribes it, then reduceToXylophone
      // fits the result onto eight bars.
      const micStateRef = useRef({ stream: null, recorder: null, chunks: [], stopTimer: null });
      const [transcribing, setTranscribing] = useState(false);
      const [progress, setProgress] = useState(0);
      const [fitNote, setFitNote] = useState(null);
      const busy = transcribing;
      const MAX_HUM_MS = 45000; // a toy tune is short; caps a forgotten recording rather than growing forever

      async function transcribeIntoPad(blob) {
        setTranscribing(true);
        setProgress(0);
        try {
          const ac = ctx();
          const arrayBuf = await blob.arrayBuffer();
          const audioBuf = await ac.decodeAudioData(arrayBuf);
          const rawNotes = await transcribeAudioBuffer(audioBuf, setProgress);
          const { detected, fit } = reduceToXylophone(rawNotes);
          if (detected.length === 0) {
            await showAlert("Couldn't find a clear melody in that recording. A single voice or instrument works best.");
            return;
          }
          // Transcription is async and can finish well after it started - pause first in case
          // the pad is still mid-playback of whatever was loaded before, so the player's
          // in-flight step() never indexes into the lines loadDetected is about to replace.
          finishPlayback();
          s.lastLiveNote = null;
          loadDetected(detected);
          setFitNote(fitMessage(fit));
        } catch (err) {
          console.error(err);
          await showAlert("Couldn't transcribe that audio. Try a clearer recording.");
        } finally {
          setTranscribing(false);
        }
      }

      async function startMic() {
        let stream;
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch { await showAlert("Couldn't access the microphone. Check the browser's permission settings."); return; }
        const chunks = [];
        const recorder = new MediaRecorder(stream);
        recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
        micStateRef.current = { stream, recorder, chunks, stopTimer: setTimeout(stopMic, MAX_HUM_MS) };
        recorder.start();
        setMicRunning(true);
      }
      function stopMic() {
        const m = micStateRef.current;
        if (!m.recorder || m.recorder.state === 'inactive') return;
        clearTimeout(m.stopTimer);
        setMicRunning(false);
        const mimeType = m.recorder.mimeType;
        m.recorder.onstop = () => {
          m.stream.getTracks().forEach(t => t.stop());
          transcribeIntoPad(new Blob(m.chunks, { type: mimeType }));
        };
        m.recorder.stop();
      }
