      function onMicClick() { micRunning ? stopMic() : startMic(); }

      // ---------- keyboard ----------
      useEffect(() => {
        function onKeyDown(e) {
          if (dialogRef.current && dialogRef.current.open) return;
          const tagName = e.target.tagName;
          if (tagName === 'INPUT' || tagName === 'SELECT' || tagName === 'TEXTAREA' || tagName === 'BUTTON') return;
          if (e.target.isContentEditable) return;
          if (e.target.classList && e.target.classList.contains('bar') && (e.key === 'Enter' || e.key === ' ')) return;
          if (s.practice.active) {
            if (e.key >= '1' && e.key <= '8') { if (!e.repeat) practiceStrike(+e.key - 1); }
            else if (e.key === 'Escape') { stopPractice(); }
            return;
          }
          if (!noteEditable(lyricMode)) {
            if (lyricMode === 'link' && e.key === 'Escape' && lyricSel) { e.preventDefault(); setLyricSel(null); }
            return;
          }
          if (e.key >= '1' && e.key <= '8') { if (!e.repeat) strike(+e.key - 1); }
          else if (e.key === 'Enter') { if (!e.repeat) newLine(); }
          else if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
          else if (e.key === 'Delete' && e.shiftKey) { e.preventDefault(); hardDelete(); }
          else if (e.key === 'Delete') { forwardDelete(); }
          else if (e.key === ' ' || e.key === '.') { e.preventDefault(); addDot(); }
          else if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) {
            e.preventDefault();
            moveCursor(e.key);
          }
        }
        document.addEventListener('keydown', onKeyDown);
        return () => document.removeEventListener('keydown', onKeyDown);
      });

      const empty = s.lines.length === 1 && s.lines[0].notes.length === 0;
      const playing = s.player.playing;
      const playLabel = playing ? '⏸ Pause' : (s.player.idx > 0 ? '▶ Resume' : '▶ Play');
      const noNotes = !hasNotes(s.lines);
      const practicing = s.practice.active;
      const practiceTargetIndex = practicing ? s.practice.events[s.practice.idx].i : null;
      const LYRIC_BTN = {
        off: {
          label: '📝 Lyrics', style: null,
          extraStyle: { backgroundImage: 'linear-gradient(to bottom right, transparent calc(50% - 1px), #c2443a calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px))' },
          title: 'Lyrics: off, nothing shown. Click to show lyrics.',
        },
        on: { label: '📖 Lyrics: On', style: BTN_BLUE, title: 'Lyrics: on, shown as one line. Click to show words grouped under their notes.' },
        grouped: { label: '🎵 Lyrics: Grouped', style: BTN_PURPLE, title: 'Lyrics: grouped, words shown under their notes. Click to start linking words to notes.' },
        link: { label: '🔗 Link words', style: BTN_PRIMARY, title: 'Lyrics: linking words to notes. Click to switch to editing text.' },
        edit: { label: '✏️ Edit text', style: BTN_AMBER, title: 'Lyrics: editing text. Click to turn lyrics off.' },
      }[lyricMode];
      const DRIVE_BTN = {
        disconnected: { label: '☁️ Connect Drive', style: null, title: 'Sync your songs to Google Drive' },
        connecting: { label: '☁️ Connecting…', style: null, title: 'Connecting to Google Drive…' },
        syncing: { label: '🔄 Syncing…', style: BTN_PRIMARY, title: 'Syncing with Google Drive…' },
        connected: { label: '☁️ Synced', style: BTN_PRIMARY, title: 'Connected to Google Drive. Click to disconnect.' },
        error: { label: '⚠️ Drive error', style: BTN_DANGER, title: 'The last Drive sync failed. Click to disconnect, then Connect to retry.' },
      }[driveStatus];

      const savedNames = Object.keys(savedSongs).sort((a, b) => a.localeCompare(b));

      return html`
        <div class="h-full flex flex-col mx-auto w-full max-w-[1120px]">
          <header class="flex items-center justify-between gap-3 flex-wrap mb-3.5 shrink-0">
            <h1 class="text-[18px] font-bold m-0 tracking-[.2px]">Xylotune</h1>
            <div class="flex gap-2 flex-wrap items-center">
              <button class=${cx(BTN, micRunning && BTN_DANGER)} disabled=${busy || practicing} onClick=${onMicClick}>${micRunning ? '⏹ Stop' : '🎤 Hum it'}</button>
              ${busy ? html`<span class="text-[13px] text-[#9aa0a6] font-semibold">⏳ Transcribing… ${Math.round(progress * 100)}%</span>` : null}
              <select class="font-semibold text-[13px] px-2.5 py-[7px] rounded-lg border border-[#3a3d42] bg-[#35383d] text-[#e8eaed]"
                disabled=${busy || practicing} value=${tuneValue} onChange=${onTuneChange}>
                <option value="">Pick a tune…</option>
                ${savedNames.map(name => html`<option key=${name} value=${name}>${name}</option>`)}
              </select>
              <button class=${cx(BTN, DRIVE_BTN.style)} disabled=${driveStatus === 'connecting' || driveStatus === 'syncing'}
                data-testid="drive-toggle" title=${DRIVE_BTN.title} onClick=${onDriveButtonClick}>${DRIVE_BTN.label}</button>
              <button class=${cx(BTN, "inline-flex items-center gap-1.5")} title="Help and keyboard shortcuts" aria-label="Help and keyboard shortcuts"
                onClick=${() => dialogRef.current.showModal()}>
                Help
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="10" />
                  <line x1="12" y1="16" x2="12" y2="11" />
                  <line x1="12" y1="8" x2="12.01" y2="8" />
                </svg>
              </button>
            </div>
          </header>

          <div class="grid grid-cols-1 min-[880px]:grid-cols-2 gap-4 flex-1 min-h-0">
            <section class="relative order-1 min-[880px]:order-2 bg-[#2a2d31] border border-[#3a3d42] rounded-[10px] p-3 flex flex-col min-h-0 h-full">
              <button class=${cx(BTN_ICON_DANGER, "absolute top-2 right-2 z-10 inline-flex items-center")} disabled=${!currentSongName || practicing}
                title="Delete the loaded song" aria-label="Delete the loaded song" onClick=${deleteSong}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="3 6 5 6 21 6" />
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                  <path d="M10 11v6" />
                  <path d="M14 11v6" />
                  <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                </svg>
              </button>

              ${fitNote ? html`
                <div class="text-[12.5px] text-[#e8c468] bg-[rgba(58,48,5,.4)] border border-[#59481a] rounded-lg px-3 py-2 mb-2.5 pr-10 shrink-0 flex items-start justify-between gap-2">
                  <span>${fitNote}</span>
                  <button type="button" class="text-[#e8c468] hover:text-white border-0 bg-transparent cursor-pointer leading-none text-[15px] shrink-0"
                    aria-label="Dismiss" onClick=${() => setFitNote(null)}>×</button>
                </div>` : null}

              <div class="flex items-center gap-2 flex-wrap mb-2.5 pr-10 shrink-0">
                <button class=${cx(BTN, BTN_PRIMARY)} disabled=${noNotes || practicing}
                  onClick=${(e) => { e.currentTarget.blur(); playing ? pausePlayback() : startOrResume(); }}>${playLabel}</button>
                <button class=${cx(BTN, "inline-flex items-center")} disabled=${noNotes || practicing} title="Restart from the beginning" aria-label="Restart"
                  onClick=${(e) => { e.currentTarget.blur(); finishPlayback(); startOrResume(); }}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                  </svg>
                </button>
                <button class=${BTN} disabled=${practicing} onClick=${doClear}>✕ Clear</button>
                <button class=${cx(BTN, LYRIC_BTN.style)} disabled=${practicing} data-testid="lyrics-toggle" aria-label=${'Lyrics mode: ' + lyricMode}
                  title=${LYRIC_BTN.title} style=${LYRIC_BTN.extraStyle} onClick=${cycleLyricMode}>${LYRIC_BTN.label}</button>
                <button class=${cx(BTN, practicing ? BTN_DANGER : BTN_BLUE)} disabled=${!practicing && noNotes} data-testid="practice-toggle"
                  title=${practicing ? 'Stop practice' : 'Practice: light up the next bar and strike it to advance'}
                  onClick=${(e) => { e.currentTarget.blur(); practicing ? stopPractice() : startPractice(); }}>${practicing ? '⏹ Stop practice' : '🎯 Practice'}</button>
                ${practicing ? html`<span class="text-[13px] font-semibold text-[#9aa0a6]" data-testid="practice-status">${`Note ${s.practice.idx + 1} of ${s.practice.events.length} · Speed ${Math.round(s.practice.speed * 100)}%`}</span>` : null}
              </div>

              <div ref=${padRef} class="flex-1 min-h-0 overflow-y-auto px-1 py-0.5">
                ${s.lines.map((line, li) => html`<${PadLine} key=${li} line=${line} li=${li} cursor=${s.cursor}
                  lyricMode=${lyricMode} lyricSel=${lyricSel} playingPos=${s.playingPos} playingTagKey=${s.playingTagKey}
                  empty=${empty && li === 0}
                  onArmNote=${armNote} onPlaceCursor=${placeCursor}
                  onSetGapSec=${(li2, ni2, sec) => { if (s.practice.active || !noteEditable(lyricMode)) return; finishPlayback(); s.lastLiveNote = null; s.lines[li2].notes[ni2].sec = sec; forceUpdate(); }}
                  onGrowGap=${(li2, ni2) => { if (s.practice.active || !noteEditable(lyricMode)) return; finishPlayback(); s.lastLiveNote = null; const gn = s.lines[li2].notes[ni2]; gn.sec = (dotCount(gn) + 1) * REST_UNIT_SEC; forceUpdate(); }}
                  onTip=${(x, y, text) => setTip({ x, y, text })} onHideTip=${() => setTip(null)}
                  onLinkSelection=${onLinkSelection} onUnlink=${onUnlink} onCaptionDone=${forceUpdate}
                  onRowClick=${onRowClick} />`)}
              </div>

              <div class="flex items-center justify-between gap-3 mt-2.5 shrink-0">
                <div class="flex items-center gap-1.5 text-[13px]">
                  <span class="font-semibold min-w-[50px]">Speed ${bpm}%</span>
                  <input type="range" min="50" max="200" step="10" value=${bpm} class="w-[90px] accent-[#12897e]"
                    onInput=${(e) => { const v = +e.target.value; bpmRef.current = v; setBpm(v); }} />
                </div>
                <button class=${BTN} disabled=${practicing} onClick=${saveSong}>💾 Save</button>
              </div>
            </section>

            <section class="order-2 min-[880px]:order-1 flex flex-col justify-center items-center gap-5 h-full min-h-0">
              <${Xylophone} barRefs=${barRefs} targetIndex=${practiceTargetIndex} onStrike=${practicing ? practiceStrike : strike} />
              <${SoundToggle} soundType=${soundType} onChange=${(v) => { soundTypeRef.current = v; saveSoundPref(v); setSoundTypeState(v); }} />
            </section>
          </div>

          <${GapTooltip} tip=${tip} />
          <${GapTooltip} tip=${linkHint} />
          <${HelpDialog} dialogRef=${dialogRef} />
          <${ActionDialog} modal=${modal} onSubmit=${submitModal} onCancel=${cancelModal} />
        </div>`;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

    // Test-only hook: the reduction engine is pure and deterministic, so Playwright can
    // exercise it directly with synthetic note data instead of routing real audio through
    // Basic Pitch. Not used by the app itself. Merged onto window.__xyloTest (not assigned)
    // since App's own effect installs getSec/pokeSec there too, and either can run first.
    window.__xyloTest = Object.assign(window.__xyloTest || {}, { skylineMelody, detectTonicPitchClass, chooseOctaveShift, foldToRegister, snapToBars, reduceToXylophone, fitMessage, SCALE_MIDI, midiFromFreq });
  </script>
</body>

</html>
